# Location codes.
#
# Publications list the places they cover (coverage.regions) in these codes,
# and the wedding location dropdown offers the same states, metros and
# countries, so a wedding's location and an outlet's coverage compare directly.
#
#   WORLD, US, INTL      whole scopes; INTL means anywhere outside the US
#   US:<region>          a group of states, defined below
#   US-<state>           ISO 3166-2 state or territory code
#   US-<state>:<metro>   a metro or area inside that state
#   <country>            ISO 3166-1 alpha-2 country code
#
# Region membership is how this file defines it; outlets rarely agree on where
# the Mid-Atlantic ends. Metros and countries are listed where research has
# needed them so far; add more as outlets name them.

scopes:
  WORLD: Anywhere
  US: United States
  INTL: Outside the United States

us_regions:
  US:northeast:
    name: Northeast
    states: [US-CT, US-ME, US-MA, US-NH, US-RI, US-VT, US-NY]
  US:mid-atlantic:
    name: Mid-Atlantic
    states: [US-NJ, US-PA, US-DE, US-MD, US-DC, US-VA, US-WV]
  US:southeast:
    name: Southeast
    states: [US-NC, US-SC, US-GA, US-FL, US-AL, US-MS, US-TN, US-KY]
  US:south-central:
    name: South Central
    states: [US-TX, US-OK, US-AR, US-LA]
  US:midwest:
    name: Midwest
    states: [US-IL, US-IN, US-IA, US-KS, US-MI, US-MN, US-MO, US-NE, US-ND, US-OH, US-SD, US-WI]
  US:southwest:
    name: Southwest
    states: [US-AZ, US-NM, US-NV]
  US:mountain-west:
    name: Mountain West
    states: [US-CO, US-UT, US-WY, US-MT, US-ID]
  US:pacific-northwest:
    name: Pacific Northwest
    states: [US-WA, US-OR]

