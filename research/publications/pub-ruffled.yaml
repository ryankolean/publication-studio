id: pub-ruffled
name: Ruffled
url: https://www.ruffledblog.com
kind: blog
tier: secondary
recheck_every_days: 90
taste_summary: Colorful, feminine, cheerful real weddings with strong decor and styling detail; recent features include a bold winter palette, a bright pink micro wedding, a moody modern Austin hotel and an organic Ritz-Carlton design.
notes: Ruffled appears to have stopped publishing. As of 2026-10-23 the newest post on the home page, in the weddings category and in the site's public WordPress posts listing is the 2026-02-04 winter wedding, more than eight months earlier; before that, features ran several times a week in November 2025. Some older posts were edited on 2026-10-09, so the site is maintained. The guidelines refer to a submission form ("Please use the form here"), but no form appears in the page's HTML; the route below is the email route the same page gives.

