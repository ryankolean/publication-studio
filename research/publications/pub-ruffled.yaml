insight:
  secret_sauce:
    - tip: Lead with styling and decor; selection rests on photography style, event styling, decor details and story.
      cite:
        - source: guidelines
          quote: Our submissions are selected based on photography style, event styling, decor details and story.
    - tip: Send a real wedding rather than a styled shoot for now; a styled shoot needs at least one Vendor Guide member to get the stronger preference.
      cite:
        - source: guidelines
          quote: we’re giving a stronger preference to real weddings over styled shoots
        - source: guidelines
          quote: we’re giving a stronger preference to those editorials where there’s at least one vendor who is a part of our directory
    - tip: Match the current wish list; micro and backyard weddings, cultural weddings, destination weddings and a colorful, cheerful mood are named.
      cite:
        - source: guidelines
          quote: Micro weddings and chic backyard weddings
        - source: guidelines
          quote: Submissions with a chic, colorful, feminine, cheerful, elegant and stylish mood
        - source: guidelines
          quote: Unique cultural weddings from diverse backgrounds
    - tip: Include the shots every feature uses, among them a stationery flatlay, a vertical of the cake, the bouquet close up, the rings in macro, place settings and the seating chart.
      cite:
        - source: guidelines
          quote: flatlay of stationery
        - source: guidelines
          quote: macro of wedding and engagement rings
        - source: guidelines
          quote: seating chart display
        - source: guidelines
          quote: "IMAGES WE USUALLY INCLUDE IN ALL OF OUR FEATURES (REAL WEDDINGS/EDITORIALS):"
        - source: guidelines
          quote: cake, vertical
        - source: guidelines
          quote: close up of bouquet
        - source: guidelines
          quote: place setting
    - tip: Send a direct download link; it gets a quicker response than a folder invitation.
      cite:
        - source: guidelines
          quote: A direct link saves us both time and space, and will ensure a quicker response.
    - tip: Skip engagement, bridal, boudoir, lifestyle, portrait and maternity sessions, which Ruffled does not typically share.
      cite:
        - source: guidelines
          quote: Lifestyle, Portrait and Maternity Sessions
        - source: guidelines
          quote: Bridal Sessions or Boudoir
        - source: guidelines
          quote: Engagement Sessions
