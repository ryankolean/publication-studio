routes:
  value:
    - platform: email
      account_required: false
      preferred: true
      steps:
        - Email the submissions inbox.
        - Include a direct link to download the images (no password, and no Dropbox or Google Drive folder invitation).
        - Include a full vendor list, with Instagram handles and hyperlinked vendor links.
        - Add the video embed URL, Instagram hashtags and a short story about the wedding or shoot.
        - If no reply comes within 2 weeks, follow up before submitting elsewhere.
      note: The inbox address is in the private contacts overlay. The same page asks submitters to "use the form here", but no form appears in the page's HTML.
  cite:
    - source: guidelines
      quote: SUBMIT DIRECTLY VIA EMAIL
    - source: guidelines
      quote: with a link to the gallery (no password required, please), a full list of vendors, video embed url, IG hashtags
    - source: guidelines
      quote: a short story about the photoshoot or real wedding
    - source: guidelines
      quote: Please use the form here with a list of @instagram handles of all vendors, a vendor list of links
    - source: guidelines
      quote: please be sure to follow up to ensure we received your submission before submitting elsewhere

package:
  image_min:
    value: 50
    cite:
      - source: guidelines
        quote: Please send anywhere from 50-100 images for us to consider
  image_max:
    value: 100
    cite:
      - source: guidelines
        quote: Please send anywhere from 50-100 images for us to consider
  resolution:
    value:
      min_width_px: 1000
      max_width_px: 3000
    cite:
      - source: guidelines
        quote: Images should be at least 1000px wide, all single files (no collages and images no larger than 3000px wide please)
  size:
    value: unknown
    checked: [ guidelines ]
    note: Only pixel widths are given; the page does not say web or print size.
  orientation_mix:
    value: Verticals of the cake, the couple together, and the bridesmaids with their bouquets.
    cite:
      - source: guidelines
        quote: cake, vertical
      - source: guidelines
        quote: couple together, vertical
      - source: guidelines
        quote: bridesmaids together with bouquets, vertical
  watermarks_allowed:
    value: false
    cite:
      - source: guidelines
        quote: No watermarks, please
  gallery_hosts:
    value: any
    cite:
      - source: guidelines
        quote: We welcome a number of different methods for sending images
      - source: guidelines
        quote: as long as it does not require to share folders such as Google Drive or Dropbox invitations
      - source: guidelines
        quote: "Here are an assortment of our preferred ways to share images: -PASS Gallery link -Pixieset link"
    note: Any download link that does not need a folder-share invitation. PASS and Pixieset are preferred; a Dropbox link must be a direct link without "home" in the URL.
  vendor_credits:
    value:
      required: true
      fields: [ instagram, website ]
      note: Instagram handles of all vendors plus a list of vendor links, hyperlinked if possible.
    cite:
      - source: guidelines
        quote: Please use the form here with a list of @instagram handles of all vendors, a vendor list of links
      - source: guidelines
        quote: Be advised we will not respond to submissions without images and/or list of vendors.
  story:
    value:
      required: true
      note: A short story about the wedding or shoot; no length is given.
    cite:
      - source: guidelines
        quote: a short story about the photoshoot or real wedding
  video_accepted:
    value: true
    cite:
      - source: guidelines
        quote: with a link to the gallery (no password required, please), a full list of vendors, video embed url, IG hashtags
  other_requirements:
    value:
      - Single image files only, no collages.
      - Keep black-and-white photos to a minimum.
      - Instagram hashtags.
      - A direct gallery link rather than a shared-folder invitation; a Dropbox link must not contain "home".
      - Note any download PIN or password with the vendor list and story.
    cite:
      - source: guidelines
        quote: Images should be at least 1000px wide, all single files (no collages and images no larger than 3000px wide please)
      - source: guidelines
        quote: Keep black and white photos to a minimum
      - source: guidelines
        quote: with a link to the gallery (no password required, please), a full list of vendors, video embed url, IG hashtags
      - source: guidelines
        quote: please ensure that “home” is not present in the URL
      - source: guidelines
        quote: If your gallery requires a download pin or password, kindly make a note of it in post content along with your vendor list and story.

