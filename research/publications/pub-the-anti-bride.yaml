insight:
  secret_sauce:
    - tip: Pitch the fashion angle; the editors want fashion-focused, non-traditional weddings, and a required form field asks how the wedding is anti-bride.
      cite:
        - source: guidelines
          quote: We love weddings that have a fashion focus, a little je ne sais quoi and those that are beautifully captured.
    - tip: Recent features credit designer outfits and outfit changes in detail, so gather the couple's outfit credits before submitting.
      cite:
        - source: feature_amanda_paul
        - source: feature_ane_diego
        - source: feature_aurelie_kyran
    - tip: Published weddings run as a couple Q&A (how they met, why the venue, guest count, budget, outfits, tips, favourite vendors); have the couple's answers ready.
      cite:
        - source: feature_ane_diego
        - source: feature_emily_josh
        - source: feature_tais_bruno
    - tip: For a styled shoot, show many collaborating vendors; couple-only shoots are refused.
      cite:
        - source: guidelines
          quote: We love sharing editorials that show a collaboration between many different wedding professionals
        - source: guidelines
          quote: We do not share editorials that are primarily couple shoots - including engagement shoots or pre-wedding shoots.
  recent_features:
    - source: feature_ane_diego
      published: 2026-10-22
      location: ES
      content_type: real_wedding
