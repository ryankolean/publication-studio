identity:
  parent_company:
    value: The Anti-Bride Co.
    cite:
      - source: home
        quote: "©2026 by The Anti-Bride Co. ™"
    note: The copyright holder named in the site footer, the outlet's own company; no separate group is named.
  sister_publications:
    value: unknown
    checked: [ about, home ]
  shared_inbox_with:
    value: unknown
    checked: [ guidelines, contact ]

coverage:
  regions:
    value: [ WORLD ]
    cite:
      - source: guidelines
        quote: We accept worldwide submissions.
  basis:
    value: unknown
    checked: [ guidelines ]
  destination_accepted:
    value: true
    cite:
      - source: guidelines
        quote: We accept worldwide submissions.
      - source: feature_aurelie_kyran
      - source: feature_emily_josh
    note: Recent features include couples marrying abroad, such as a Luxembourg couple in Japan and a US couple in Germany.

content:
  real_wedding:
    value: true
    cite:
      - source: guidelines
        quote: "We are always looking for authentic, non-traditional, modern and above all 'anti-bride' weddings to feature."
  elopement:
    value: true
    cite:
      - source: guidelines
        quote: think elopements, relaxed micro-weddings with the couple in bold colours or prints
  styled_shoot:
    value: true
    cite:
      - source: guidelines
        quote: We accept a small number of worldwide styled shoot submissions captured in an editorial style.
    note: Editorials only; shoots that are mainly of the couple (engagement or pre-wedding) are refused.
  style_tags:
    value: [ alternative_nontraditional, fashion_forward_editorial, culturally_rooted, multiple_looks, wedding_suit_pantsuit, intimate_micro ]
    cite:
      - source: guidelines
        quote: We love weddings that have a fashion focus, a little je ne sais quoi and those that are beautifully captured.
      - source: feature_ane_diego
      - source: feature_amanda_paul
      - source: feature_emily_josh
      - source: feature_aurelie_kyran
      - source: feature_tais_bruno
  seasonality:
    value: unknown
    checked: [ guidelines ]

routes:
  value:
    - platform: web_form
      url: https://www.antibride.com.au/photography-submissions
      account_required: false
      preferred: true
      steps:
        - Confirm you are the photographer or wedding planner, and say whether the wedding has been published in a magazine or blog.
        - Give your name, email and the date of the wedding or editorial.
        - Paste a Pixieset or similar gallery link with hi-res and web-size downloads; no Dropbox.
        - List the vendors involved and explain what makes the wedding anti-bride.
        - Tick that every submission criterion has been met, then submit.
      note: The form sits on the public submissions page and asks for no sign-in.
  cite:
    - source: guidelines
      quote: Are you the photographer or wedding planner?
    - source: guidelines
      quote: What makes your submission a good fit for The Anti-Bride? How is this wedding anti-bride?

package:
  image_min:
    value: 100
    cite:
      - source: guidelines
        quote: Please only submit a gallery of around 100-120 images, which shows the whole story of the day/weekend
    note: Around 100 to 120 images for a real wedding; around 50 to 70 for a styled shoot.
  image_max:
    value: 120
    cite:
      - source: guidelines
        quote: Please only submit a gallery of around 100-120 images, which shows the whole story of the day/weekend
    note: Around 50 to 70 images for a styled shoot.
  resolution:
    value:
      note: The gallery must offer both hi-res and web-size downloads; no pixel sizes are given.
    cite:
      - source: guidelines
        quote: with hi-res and web size images ready for download
  size:
    value: both
    cite:
      - source: guidelines
        quote: with hi-res and web size images ready for download
  orientation_mix:
    value: unknown
    checked: [ guidelines ]
  watermarks_allowed:
    value: unknown
    checked: [ guidelines ]
  gallery_hosts:
    value:
      - pixieset
      - pic_time
      - shootproof
      - smugmug
    cite:
      - source: guidelines
        quote: Please submit your images using a Pixieset or similar gallery (please no Dropbox link)
    note: Pixieset is named; the others are read from "or similar gallery". Dropbox links are refused.
  vendor_credits:
    value:
      required: true
      fields: [ business_name ]
      note: A required form field lists the vendors' names; styled shoots must name every vendor involved.
    cite:
      - source: guidelines
        quote: Please list names of vendors invloved.
      - source: guidelines
        quote: Please make sure to include all vendors that were involved in creating your styled shoot on our submission form.
  story:
    value:
      required: true
      note: A required form field asks what makes the submission a good fit and how the wedding is anti-bride. Published features run as a couple Q&A covering how they met, venue, guests, budget, outfits, tips and vendors.
    cite:
      - source: guidelines
        quote: What makes your submission a good fit for The Anti-Bride? How is this wedding anti-bride?
  video_accepted:
    value: unknown
    checked: [ guidelines ]
  other_requirements:
    value:
      - "The wedding must be \"anti-bride\", that is non-traditional."
      - The gallery shows the whole day, from getting ready through the ceremony to the celebration after.
      - Styled shoots must not be primarily couple, engagement or pre-wedding shoots.
      - The form ends with a checkbox confirming every submission criterion has been met.
      - The photographer or planner of any accepted wedding must become an Anti-Bride brand partner (see economics).
    cite:
      - source: guidelines
        quote: "We only accept weddings that are 'anti-bride'"
      - source: guidelines
        quote: which shows the whole story of the day/weekend (i.e. getting ready, ceremony, celebration after the ceremony)
      - source: guidelines
        quote: We do not share editorials that are primarily couple shoots - including engagement shoots or pre-wedding shoots.
      - source: guidelines
        quote: All of the submission criteria has been met.
      - source: guidelines
        quote: we require the photographer or wedding planner from any accepted submission to be an Anti-Bride partner.

rules:
  exclusivity:
    value: unknown
    checked: [ guidelines ]
    note: The guidelines require weddings not published elsewhere before (see prior_exposure) but say nothing about exclusivity during review or after publication.
  prior_exposure:
    publications:
      value: disqualifies
      cite:
        - source: guidelines
          quote: We only accept weddings that have not been published in any other online publications or magazines.
    blogs:
      value: unknown
      checked: [ guidelines ]
      note: The form asks whether the wedding has been published in a magazine or blog; the guidelines name only online publications and magazines, so a photographer's own blog post is not addressed.
    social:
      value: unknown
      checked: [ guidelines ]
  freshness_window_months:
    value: 12
    cite:
      - source: guidelines
        quote: We only accept recent weddings that have taken place within the past 12 months.
  photographer_frequency:
    value: unknown
    checked: [ guidelines ]
  submitter_roles:
    value: [ photographer, planner ]
    cite:
      - source: guidelines
        quote: We only accept submissions from (primary) photographers and wedding planners/stylists.
    note: Couples may not submit directly.

