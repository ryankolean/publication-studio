id: pub-the-anti-bride
name: The Anti-Bride
url: https://www.antibride.com.au
kind: destination_international
tier: primary
recheck_every_days: 90
taste_summary: Non-traditional, fashion-led real weddings from anywhere in the world, with designer outfits and outfit changes, micro weddings and elopements, and couples blending cultures.
notes: The Australian online magazine at antibride.com.au, not theantibride.com (a Jacksonville florist and planner). The Brand Partnerships enquiry form asks for a portfolio gallery link with 20 images of recent work.

