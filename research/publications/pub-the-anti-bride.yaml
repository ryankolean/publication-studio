      - source: guidelines
        quote: we are only able to respond to submissions that meet all of the criteria above.
    note: Only submissions meeting every criterion get a reply; after 2 to 3 weeks (stored as 21 days) a follow-up email is invited.
  publish_lead_days:
    value: unknown
    checked: [ guidelines ]
  publishing_cycle:
    value: Online magazine; new real weddings were posted several times a week in October 2026.
