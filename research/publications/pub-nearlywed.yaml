      - source: submissions_post
        quote: Real Weddings is a section of Nearlywed dedicated to showcasing real-life weddings from across the state of Michigan and beyond.
    note: Statewide Michigan, by wedding location. Print issues feature weddings held in Michigan; the online section also takes weddings outside Michigan (the form's last region is "Outside Michigan"), see destination_accepted.
