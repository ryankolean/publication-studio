routes:
  value:
    - platform: web_form
      url: https://nearlywed.com/submit-your-wedding/
      account_required: false
      preferred: true
      steps:
        - Open the Submit Your Wedding form.
        - Say who is submitting (couple, planner, photographer or other) and give the wedding date, your email, both newlyweds' names and a newlywed email.
        - Pick the wedding location (Mid, Northern, Southeast or West Michigan, or Outside Michigan).
        - Give the photographer's name and email, the wedding gallery link and any gallery download PIN; add planner, videographer and video link if there are any.
        - Fill in the vendor list by category and submit.
      note: One form serves print and online; the editors decide where a wedding runs and pick the images from the linked gallery.
  cite:
    - source: form
      quote: Submit yours by filling out the information & vendor list below.
    - source: submissions_post
      quote: Couples and vendors can submit weddings for consideration by filling out a submission form
    - source: real_weddings
      quote: Couples have the chance to be featured online in our Real Weddings section of the website or in the printed issue.
    - source: form
      quote: Who is submitting this wedding? * Couple Planner Photographer Other
    - source: form
      quote: Submitter's Email *
    - source: form
      quote: Wedding location Mid Michigan Northern Michigan Southeast Michigan West Michigan Outside Michigan
    - source: form
      quote: Photographer * Photographer Email * Wedding Gallery Link *
    - source: form
      quote: Wedding Planner Wedding planner email Videographer Wedding video link

