insight:
  secret_sauce:
    - tip: Link the photographer's gallery with its download PIN; the editors pick the images from it.
      cite:
        - source: submissions_post
          quote: Additionally, they provide a link to their wedding photographer’s gallery, which our editorial team will review to select images
        - source: form
          quote: Gallery Download PIN
    - tip: Fill in every vendor; every vendor is listed on the feature and gets free advertising from it.
      cite:
        - source: submissions_post
          quote: all the vendors that helped make that celebration come to life are listed and receive free advertising
    - tip: Weddings that miss print can still run online, in email, on the blog and on social.
      cite:
        - source: submissions_post
          quote: Not all weddings will be selected for a magazine feature, but this does not mean your wedding and vendors are not being seen!
        - source: submissions_post
          quote: there are so many avenues for exposure through the Real Weddings submissions, including in email blasts, through the website, in blog posts, on social media
    - tip: Fit the house look; the editors select weddings against the platform's aesthetic and editorial guidelines.
      cite:
        - source: submissions_post
          quote: selects weddings that align with the platform’s aesthetic and editorial guidelines for feature consideration
    - tip: An older wedding is not ruled out; a September 2024 wedding was published as a feature on 2026-06-22.
      cite:
        - source: feature_david_jack
          quote: who married at the Shinola Hotel in downtown Detroit on September 7, 2024
