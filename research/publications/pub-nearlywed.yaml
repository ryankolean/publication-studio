taste_summary: Statewide Michigan real weddings of every style and budget; online features are a gallery plus a full vendor list, and selected weddings get written features in the Spring and Fall print issues.
notes: Online Real Weddings pages show the wedding date, not a publish date; their publish dates come from each page's own WordPress record (the JSON link in the page head), cited as wp_api. The site has no about page (the footer "About Us" is not a link). The digital magazine is an Issuu embed and its masthead was not read.

