routes:
  value:
    - platform: web_form
      url: https://greenweddingshoes.com/submit-a-wedding/
      account_required: false
      preferred: true
      steps:
        - Open the four-step form and give the submitter's contact details and role (member of the couple, wedding party or family, or wedding professional).
        - Give the couple's names, wedding titles and pronouns.
        - Choose Real Wedding or Styled / Inspirational Photoshoot, give a descriptive title, and say why GWS should feature it.
        - Link 50 to 250 photos (PASS Gallery or Pixieset preferred, Dropbox accepted), plus a public video link and an optional 9:16 vertical video.
        - Credit the vendors; the photographer's name, website and Instagram are required.
        - Agree to the GWS submission terms and submit, then keep the confirmation email.
      note: The form is on the public page with no sign-in, and it offers Save and Continue Later. If no confirmation email arrives, GWS did not receive the submission.
  cite:
    - source: form
      quote: Step 1 of 4 - Submitter Contact Info
    - source: guidelines
      quote: You will receive a confirmation email when you submit the form
    - source: guidelines
      quote: if you don't receive a confirmation email, we didn't receive your submission

package:
