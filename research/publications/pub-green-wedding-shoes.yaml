insight:
  secret_sauce:
    - tip: Show the couple's personality and fashion; the editors want a fashion-forward couple whose style runs from decor to attire.
      cite:
        - source: guidelines
          quote: A fashion-forward couple whose style is evident from their wedding decor to their attire.
        - source: guidelines
          quote: We love showcasing weddings of couples of all types with fashion and personality
    - tip: Lead with unusual, personal details, ideally a new twist on an old idea; recent features center on handmade dresses, hand-painted decor and DIY cakes.
      cite:
        - source: guidelines
          quote: We love unique and fabulous wedding details, especially when they include a new twist on an old idea
        - source: guidelines
          quote: A love for the small personal details – this is what inspires our readers!
        - source: feature_micarah_tewers
        - source: feature_austin
    - tip: Budget does not decide it; low-budget and over-the-top weddings both run.
      cite:
        - source: guidelines
          quote: We feature low-budget, high-budget, simple paired-back weddings, and elaborate over-the-top weddings.
    - tip: Technical quality is a stated criterion; send properly lit, consistently processed, in-focus images.
      cite:
        - source: guidelines
          quote: Properly lit and consistently processed photos that are in focus
    - tip: Keep the pitch short and confident; the why-feature field wants a succinct overview of how the wedding stands out.
      cite:
        - source: form
          quote: We don't need 5,000 words, but a succinct overview is super helpful.
    - tip: Add a 9:16 vertical clip of 60 seconds or less; GWS may use it to promote the feature.
      cite:
        - source: form
          quote: If you have video that is 9:16 (1080px X 1920px) we may use it to promote your video
    - tip: Skip engagement sessions unless they are unusual.
      cite:
        - source: guidelines
          quote: Please note that we are currently not looking for engagement submissions unless it's something unique.
