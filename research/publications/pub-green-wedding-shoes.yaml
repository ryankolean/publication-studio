        quote: Please be sure your video is public and does not require a password.
      - source: form
        quote: If you have video that is 9:16 (1080px X 1920px) we may use it to promote your video
  other_requirements:
    value:
      - A descriptive title for the submission.
      - No links to a blog post and no zip files.
      - Vertical video, if sent, as short clips or one edited clip of no more than 60 seconds.
      - Couples submitting their own wedding need their photographer's permission.
      - Say so if the feature was also submitted to other blogs.
      - No weddings on a plantation, with cotton fields or raw cotton, Native American headdress, real fur, smoking or guns.
    cite:
