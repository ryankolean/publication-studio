        quote: Images must be at least 2200 pixels wide and without watermarks.
  gallery_hosts:
    value: [ pixieset, dropbox, wetransfer ]
    cite:
      - source: form
        quote: PASS Gallery and Pixieset links are our preferred method for photo delivery
      - source: form
        quote: We strongly suggest using either Dropbox, PASS Gallery or Pixieset for delivering your photos to us.
      - source: form
        quote: Only use WeTransfer if you have a WeTransfer Plus (paid) account.
    note: PASS Gallery, preferred alongside Pixieset, is not in the schema's host list. The form also has an Other link option. WeTransfer only from a paid Plus account; no blog-post links or zip files.
  vendor_credits:
    value:
