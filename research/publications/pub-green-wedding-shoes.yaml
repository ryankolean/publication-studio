id: pub-green-wedding-shoes
name: Green Wedding Shoes
url: https://greenweddingshoes.com
kind: blog
tier: primary
recheck_every_days: 90
taste_summary: Fashion-forward, personality-driven weddings with handmade and DIY details; recent features are color-saturated, playful and culturally rooted, often with several outfit changes.
notes: The site's Cloudflare check refused curl (HTTP 403), so the pages were read through a rendering fetch tool, with each quote checked against the page in a second pass; the quote verifier later fetched every cited page and found every quote. Feature pages show no visible publish date; the dates below come from each page's structured data (datePublished). The Real Weddings category page (https://greenweddingshoes.com/category/real-weddings/) lists no posts without JavaScript; the features were found through the home page. Separate forms exist for TikTok or Instagram Reels and for home tours.

