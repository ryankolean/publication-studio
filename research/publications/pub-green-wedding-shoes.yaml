        quote: All photos must be at least 2200px wide.
      - source: guidelines
        quote: Images should be delivered as close to 2200px in width as possible; we don't need images any larger than 2200px wide.
      - source: guidelines
        quote: both portrait AND landscape photos should have a min-width of 2200 pixels.
