routes:
  value:
    - platform: web_form
      url: https://www.weddingchicks.com/submit/
      account_required: false
      preferred: true
      steps:
        - Open the submit page; the form is public.
        - Enter your name and email, both partners' names, the wedding date and the location.
        - Upload your best 40 to 60 images (JPG or PNG, about 2MB each at most) and add any YouTube or Vimeo link.
        - Credit every vendor, including yourself with your links and Instagram handle.
        - Add a suggested post title and the story, confirm you have permission to submit, and send.
  cite:
    - source: submit
      quote: Drag & Drop Your Best 40 - 60 Images
    - source: submit
      quote: "Suggested Image Size: MAX 2MB"
    - source: submit
      quote: Please ensure every vendor is credited.
    - source: submit
      quote: I confirm that I have permission to submit these photos and content for feature.

