id: pub-the-knot
name: The Knot
url: https://www.theknot.com
kind: national_magazine
tier: primary
recheck_every_days: 90
taste_summary: Personal, relatable real weddings from every season, built around details the editors have not seen before; domestic weddings first.
notes: theknot.com answers plain fetches with an Access Denied page; every page below was read in a browser on 2026-10-23. Album pages show no publish date, so recent_features is empty; the style tags come from the albums' setting and theme labels.

