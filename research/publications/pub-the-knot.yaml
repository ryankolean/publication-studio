routes:
  value:
    - platform: two_bright_lights
      url: https://www.twobrightlights.com
      account_required: true
      preferred: true
      steps:
        - Log in or sign up for free on Two Bright Lights.
        - Open Albums and choose Create Album.
        - If you are not the photographer, request the photographer's permission in Two Bright Lights and wait for it.
        - Categorize the album, enter the event details and the album story, and add every vendor.
        - Add descriptive tags such as photography style, setting, religion and season.
        - Add at least 80 images and check each one you want sent.
        - Choose Exclusive Submission when prompted, select TheKnot.com, and submit.
        - If the editors are interested, send the couple's questionnaire back within three weeks.
  cite:
    - source: guide
      quote: Currently, the team uses a platform called Two Bright Lights to receive and review all wedding submissions.
    - source: guide
      quote: "Log in or sign up for free on twobrightlights.com."
    - source: guide
      quote: You won't be able to move forward with your submission until you have the photographer's permission.
    - source: guide
      quote: you'll need to select "Exclusive Submission" when the pop-up box prompts you.
    - source: guide
      quote: "For digital submissions, click *TheKnot.com."
    - source: guide
      quote: within three weeks of notification

package:
  image_min:
    value: 80
    cite:
      - source: guide
        quote: The Knot Editors would like you to add at least 80 images from the event to upload
  image_max:
    value: 2000
    cite:
      - source: guide
        quote: but you can upload up to 2,000.
    note: The Two Bright Lights upload cap. 100 to 150 images is ideal, and the editors curate about 30 to 40.
  resolution:
    value:
      note: Two Bright Lights suggests high-resolution 5 MB JPEGs at least "2,00" pixels wide (as printed; probably 2,000).
    cite:
      - source: guide
        quote: high-resolution images of 5 MB in JPEG format that have a minimum size of 2,00 pixels wide
  size:
    value: unknown
    checked: [ guide ]
    note: The guide asks for high-resolution files but never says web or print.
  orientation_mix:
    value: A mix of horizontal and vertical photos, with variety in scale.
    cite:
      - source: guide
        quote: include a mix of horizontal and vertical photos, along with scale variety, no matter the photography style
  watermarks_allowed:
    value: unknown
    checked: [ guide ]
  gallery_hosts:
    value:
      - direct_upload
      - dropbox
      - shootproof
      - smugmug
      - google_drive
      - pic_time
      - pixieset
    cite:
      - source: guide
        quote: You can upload them directly from your computer or other image-housing platforms such as Dropbox, ShootProof, SmugMug and Zenfolio.
    note: Images go into Two Bright Lights from a computer or an image-housing platform. Dropbox, ShootProof, SmugMug and Zenfolio are named; the others are read from "such as".
  vendor_credits:
    value:
      required: true
      note: Every vendor involved in the event.
    cite:
      - source: guide
        quote: Please enter all vendors involved in the event.
  story:
    value:
      required: true
      questionnaire: true
      note: Two Bright Lights asks for the album story; if the editors are interested, the couple completes The Knot's questionnaire.
    cite:
      - source: guide
        quote: TBL will prompt you to enter a variety of information like the celebration's location, the album story and more.
      - source: guide
        quote: a couple's questionnaire must be completed in order for The Knot to accept a Real Wedding submission
  video_accepted:
    value: unknown
    checked: [ guide ]
  other_requirements:
    value:
      - Several shots of design details and candid shots of the couple.
      - The wedding must already have taken place.
    cite:
      - source: guide
        quote: Please add multiple shots of design details
      - source: guide
        quote: don't forget to include candid shots of the couple
      - source: guide
        quote: we don't accept submissions before the event takes place.

rules:
  exclusivity:
    value:
      policy: exclusive_required
      during_review: true
      after_publication_days: 90
    cite:
      - source: guide
        quote: Yes, we require exclusivity of the wedding for three months.
      - source: guide
        quote: which starts after the event is live on our site.
      - source: guide
        quote: you'll need to select "Exclusive Submission" when the pop-up box prompts you.
    note: Three months stored as 90 days. It covers offering the photos and story to other publications and social media brands.
  prior_exposure:
    publications:
      value: disqualifies
      cite:
        - source: guide
          quote: we don't accept celebrations that have—or will be—published in another magazine or on a blog.
    blogs:
      value: allowed
      cite:
        - source: guide
          quote: it's okay for the wedding pros who produced the event to blog about it and post it on their own social media accounts.
      note: The vendors' own blogs only; a feature on someone else's blog disqualifies.
    social:
      value: allowed
      cite:
        - source: guide
          quote: it's okay for the wedding pros who produced the event to blog about it and post it on their own social media accounts.
      note: The vendors' own accounts; offering the story to social media brands is barred for three months after publication.
  freshness_window_months:
    value: 12
    cite:
      - source: guide
        quote: we ask that you don't submit an event older than one year from the day you're submitting.
  photographer_frequency:
    value: unknown
    checked: [ guide ]
    note: The guide welcomes many submissions at once but says nothing about how often one photographer is featured.
  submitter_roles:
    value: [ photographer, planner, vendor ]
    cite:
      - source: guide
        quote: photographers take the lead on submitting weddings to The Knot for consideration
      - source: guide
        quote: Newlyweds can't submit their wedding independent of a wedding pro.
    note: Couples only through one of their vendors; anyone but the photographer needs the photographer's permission.

