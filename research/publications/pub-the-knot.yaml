insight:
  secret_sauce:
    - tip: Have the photographer, venue and planner listed on The Knot Vendor Marketplace; their submissions are prioritized.
      cite:
        - source: guide
          quote: we're prioritizing submissions from photographers, venues and planners with business listings on The Knot Vendor Marketplace
    - tip: Open with an environmental shot or a couple portrait; that is how the editors start an album.
      cite:
        - source: guide
          quote: We typically start The Knot Real Weddings albums with an environmental shot or a couple portrait
    - tip: Show what made the wedding personal; the editors want details they have not seen before.
      cite:
        - source: guide
          quote: We're most inspired by details we haven't seen before that tell a couple's story.
    - tip: Send 100 to 150 images covering the whole weekend; the editors curate about 30 to 40.
      cite:
        - source: guide
          quote: While we tend to curate a final album of about 30 to 40 photos
        - source: guide
          quote: 100–150 is most ideal
    - tip: Credit the whole vendor team; couples hire about 13 vendors on average.
      cite:
        - source: guide
          quote: couples hire an average of 13 different vendors
  recent_features: []
