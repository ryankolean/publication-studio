insight:
  secret_sauce:
    - tip: If the wedding is on the photographer's own blog, just send that link; it is the easiest first step.
      cite:
        - source: guidelines
          quote: The easiest thing to do is send me a link to the wedding if you have blogged it on your own site.
    - tip: Send pictures that tell the story of the day, with plenty of details, couple portraits and an overview of the whole wedding.
      cite:
        - source: guidelines
          quote: Main things I look out for are photos that tell the story of the wedding day
        - source: guidelines
          quote: detail shots are good as my readers love them, but also portrait shots of the couple and an overview of the whole wedding day.
    - tip: Have around 100 images ready; features usually run about 80.
      cite:
        - source: guidelines
          quote: I usually feature about 80 images per wedding so I need around 100 images for me to pick from.
    - tip: Any style can work if it fits the Boho brand, destination weddings included.
      cite:
        - source: guidelines
          quote: "I am interested in lots of different styles of weddings: Bohemian, luxe, rustic, alternative, glam, modern, quirky, DIY, whimsical, destination"
        - source: guidelines
          quote: anything goes as long as it fits with the ‘BOHO’ brand.
    - tip: Weddings from a wide range of cultures and communities are wanted.
      cite:
        - source: guidelines
          quote: It is important that I represent all weddings from a wide variety of cultures and communities.
    - tip: Re-send if there is no reply within 3 days.
      cite:
        - source: guidelines
          quote: if you haven’t heard back within 3 days do re send the submission.
    - tip: Be ready to write up the day; recent features hand over to the photographer or planner to describe it.
      cite:
        - source: feature_new_york
          quote: Sarah the photographer tells us more about the day
        - source: feature_costa_rica
          quote: Meghan the planner tells us more about the day.
  recent_features:
