routes:
  value:
    - platform: email
      account_required: false
      preferred: true
      steps:
        - Email the submission to the editor's inbox.
        - Send a link to the wedding if it is on the photographer's own blog; otherwise send about 50 JPEG images by Dropbox or in a small zip file.
        - Expect a yes or no; re-send if there is no reply within 3 days.
        - If accepted, send around 100 images for the full post as instructed, and pass the form to the couple.
      note: The address is in the private contacts overlay.
  cite:
    - source: guidelines
      quote: Please email all submissions to
    - source: guidelines
      quote: The easiest thing to do is send me a link to the wedding if you have blogged it on your own site.
    - source: guidelines
      quote: If not then I will need 50ish images in jpeg format, sent to me via drop box or in a small zip file.
    - source: guidelines
      quote: If successful I will then send you further information on how to submit the full wedding to me

package:
  image_min:
    value: 50
    cite:
      - source: guidelines
        quote: If not then I will need 50ish images in jpeg format, sent to me via drop box or in a small zip file.
    note: About 50 for the first look when there is no blog post to link; around 100 are needed for the full post.
  image_max:
    value: unknown
    checked: [guidelines]
    note: The editor usually features about 80 images per wedding and asks for around 100 to choose from; no upper limit is stated.
  resolution:
    value:
      min_width_px: 1000
      note: Ideally around 2000px wide; JPEG format.
    cite:
      - source: guidelines
        quote: The images should be no smaller than 1000px wide, ideally around 2000px in width.
  size:
    value: unknown
    checked: [guidelines]
    note: Only pixel widths are given.
  orientation_mix:
    value: unknown
    checked: [guidelines]
  watermarks_allowed:
    value: unknown
    checked: [guidelines]
  gallery_hosts:
    value: [dropbox, direct_upload]
    cite:
      - source: guidelines
        quote: sent to me via drop box or in a small zip file.
    note: A small zip file is sent with the email. A link to the photographer's own blog post of the wedding is the easiest first step when one exists.
  vendor_credits:
    value: unknown
    checked: [guidelines]
    note: The submit page does not ask for credits; published features end with a "Supplier Shout Outs" list.
  story:
    value: unknown
    checked: [guidelines]
    note: After acceptance a form goes to the couple; the page does not say a written story is required. Published features carry the couple's, planner's or photographer's account of the day.
  video_accepted:
    value: unknown
    checked: [guidelines]
  other_requirements:
    value:
      - Images in JPEG format.
      - Photos that tell the story of the wedding day, with detail shots, portraits of the couple and an overview of the whole day.
      - A couple submitting their own wedding needs the photographer's permission, and the photographer must email permission to use the images.
    cite:
      - source: guidelines
        quote: If not then I will need 50ish images in jpeg format
      - source: guidelines
        quote: Main things I look out for are photos that tell the story of the wedding day
      - source: guidelines
        quote: detail shots are good as my readers love them, but also portrait shots of the couple and an overview of the whole wedding day.
      - source: guidelines
        quote: please get permission from your photographer before you send anything to me.
      - source: guidelines
        quote: I will also need an email from the photographer giving me permission to use their images.

rules:
  exclusivity:
    value:
      policy: exclusive_required
    cite:
      - source: guidelines
        quote: I only post weddings that haven’t been featured on any other UK blogs
      - source: guidelines
        quote: please let me know if you are submitting your wedding to more than one Blog.
      - source: guidelines
        quote: I also ask for a 6 weeks window before you submit it anywhere else.
    note: First showing among UK blogs only. Sending to more than one blog must be disclosed. The 6-week window is not tied to a start point (submission or publication), so it is not stored as days after publication.
  prior_exposure:
    publications:
      value: disqualifies
      cite:
        - source: guidelines
          quote: I only post weddings that haven’t been featured on any other UK blogs
      note: Applies to other UK blogs; the page says nothing about outlets outside the UK.
    blogs:
      value: allowed
      cite:
        - source: guidelines
          quote: The easiest thing to do is send me a link to the wedding if you have blogged it on your own site.
    social:
      value: unknown
      checked: [guidelines]
  freshness_window_months:
    value: unknown
    checked: [guidelines]
    note: No rule is stated; the newest feature ran about 19 months after its March 2025 wedding.
  photographer_frequency:
    value: unknown
    checked: [guidelines]
  submitter_roles:
    value: [photographer, couple]
    cite:
      - source: guidelines
        quote: If you think this sounds like your wedding or your work then I’d love for you to get in touch!
      - source: guidelines
        quote: If you are a couple and you would like to submit your own wedding, the same rules apply
      - source: guidelines
        quote: The easiest thing to do is send me a link to the wedding if you have blogged it on your own site.
    note: The main instructions address the photographer whose work and blog post it is; couples may submit with the photographer's permission. Recent features were also written up by a planner and credit a wedding PR agency, but no page names those roles.

