id: pub-boho-weddings
name: Boho Weddings
url: https://www.boho-weddings.com
kind: destination_international
tier: secondary
recheck_every_days: 90
taste_summary: '"Boho Luxe" real weddings across many styles, from relaxed beach and woodland days to colourful mid-century and cultural celebrations; recent features are mostly US and destination weddings told with the couple, planner or photographer Q&A.'
notes: UK blog (Sheffield) run by one editor. US weddings are published often (three of the newest five are in California and New York, and recent features also include Rhode Island and Massachusetts). The submit page lists "destination" among the wedding styles it wants; the exclusivity rule covers other UK blogs only. The submissions address is in the private contacts overlay; its link target and its displayed text differ (see the overlay).

