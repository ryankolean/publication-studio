  couple_consent_required:
    value: unknown
    checked: [guidelines]
    note: A form goes to the couple after acceptance; the page does not ask for their consent.
  vendor_consent_required:
    value: true
    cite:
      - source: guidelines
        quote: I will also need an email from the photographer giving me permission to use their images.
    note: The photographer's permission by email, asked for when the couple submits their own wedding.

