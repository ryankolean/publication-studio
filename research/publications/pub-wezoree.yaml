id: pub-wezoree
name: Wezoree
url: https://wezoree.com
kind: destination_international
tier: secondary
recheck_every_days: 90
taste_summary: Long, story-led features with full vendor credits; chateaux, castles and destination weddings in Europe, Asia and Africa alongside US cities.
notes: A vendor directory and subscription platform with a real-weddings gallery and an online magazine with a limited print run. Free editorial consideration exists, but a processing fee applies if a wedding is selected, and a paid option guarantees placement. Published dates come from the real-weddings listing, since the feature pages carry no usable date.

