economics:
  submission_fee:
    value: none
    cite:
      - source: real_weddings
        quote: submit it free of charge for editorial review, though publication is not guaranteed
      - source: form
        quote: "Complimentary Editorial Consideration: I'd like to submit my wedding for editorial consideration."
  publication_fee:
    value:
      amount: undisclosed
      currency: USD
      note: Charged to whoever submitted if the wedding is selected; it covers story development, writing, visual curation, design, publication and some promotion. No amount is published, and the real-weddings page describes the free route without mentioning it. USD is taken from the dollar prices on the advertising page.
    cite:
      - source: guidelines
        quote: If your submission is selected for publication, a processing fee will apply and will be covered by the person or company submitting the wedding.
      - source: refund
        quote: features in articles, Real Wedding publications, or custom promotions
  priority_paid_tier:
    value:
      name: Guaranteed Editorial Feature
      price:
        amount: undisclosed
        currency: USD
      note: A paid submission option with confirmed placement; a Top subscription also includes a guaranteed feature. No price is published.
    cite:
      - source: form
        quote: "Guaranteed Editorial Feature: I'm interested in a guaranteed paid publication to showcase my work on Wezoree."
      - source: real_weddings
        quote: choose the paid submission option for a confirmed placement
      - source: real_weddings
        quote: if you hold a Top subscription, you receive a guaranteed feature as part of your plan
  reach:
    value:
