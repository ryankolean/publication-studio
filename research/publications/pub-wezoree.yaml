routes:
  value:
    - platform: web_form
      url: https://docs.google.com/forms/d/12WPA86dmzwTIRvKIoLBiMoSAr3l1S8NIpLztFlG-O1c/viewform
      account_required: false
      preferred: true
      steps:
        - Fill out the short Real Wedding form with email, the couple's names, venue and city, wedding date, a gallery link and any gallery password.
        - Optionally add the planner's Instagram and a Google Drive link to behind-the-scenes vendor content.
        - Choose complimentary editorial consideration, a guaranteed paid feature, or ask about both.
        - If the wedding is selected, the editors reply within 15 days; then complete the detailed form about the event.
      note: Google sign-in is optional and only saves progress. A processing fee applies if the wedding is selected (see economics).
  cite:
    - source: guidelines
      quote: Submit the short Real Wedding form.
    - source: form
      quote: Sign in to Google to save your progress.
    - source: guidelines
      quote: You will need to fill out the detailed form and provide more information about the event.

