insight:
  secret_sauce:
    - tip: Lead with story and atmosphere; the editors want interesting stories, authentic moments and photos that capture the whole day.
      cite:
        - source: real_weddings
          quote: Our editorial team is looking for interesting stories, authentic moments, and photos that capture the full atmosphere of a wedding.
    - tip: Features run long and in fixed sections (love story, morning details, getting ready, first look, ceremony, portraits, venue and decor, couple's advice, reception), so send a gallery covering each part and gather the couple's quotes.
      cite:
        - source: feature_rocher_portail
        - source: feature_ashford
        - source: feature_hospitalet
    - tip: Fill in the optional Google Drive link to behind-the-scenes vendor content; the form asks for it to show vendors at work.
      cite:
        - source: form
          quote: Please add Google Drive link with any available behind-the-scenes content showcasing vendors’ work during the wedding
