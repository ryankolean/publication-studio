insight:
  secret_sauce:
    - tip: Join the Vendor Guide, or work with a vendor who is in it; members are reviewed first, and three of the five newest features credit a Guide member.
      cite:
        - source: guidelines
          quote: we prioritize features from our Vendor Guide members and creative partners
