routes:
  value:
    - platform: email
      account_required: false
      preferred: true
      steps:
        - Email the editorial submissions inbox (the Submit an Event button on the submissions page opens it).
        - Give your name and your Vendor Guide listing link, if you have one.
        - Add a descriptive title for the submission and a note on what makes it unique.
        - Link a highlight gallery of 75 to 150 of the best photos, each 2000 pixels wide.
        - Expect a reply within three weeks only if the submission is a fit.
      note: The inbox address is in the private contacts overlay. Vendor Guide members and creative partners are reviewed first; non-members are accepted only occasionally.
  cite:
    - source: guidelines
      quote: CLICK HERE TO SUBMIT AN EVENT
    - source: contact
      quote: FOR EDITORIAL SUBMISSIONS
    - source: guidelines
      quote: Your name and 100 Layer Cake Vendor Guide listing link, if you have one
    - source: guidelines
      quote: A descriptive title for your submission
    - source: guidelines
      quote: A note on what makes your submission unique
    - source: guidelines
      quote: we prioritize features from our Vendor Guide members and creative partners
    - source: guidelines
      quote: We do occasionally accept a limited number of non-member submissions that feel especially aligned.

