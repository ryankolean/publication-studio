id: pub-100-layer-cake
name: 100 Layer Cake
url: https://www.100layercake.com
kind: blog
tier: secondary
recheck_every_days: 90
taste_summary: Design-forward, fashion-led weddings with a strong point of view; recent features run from surrealist black tie and sculptural Italian villa florals to a colorful Miami beach club, often with several outfit changes.
notes: The email route is open to anyone, but paid Vendor Guide members and creative partners are reviewed first and non-members are accepted only occasionally. Three of the five newest features credit a Guide member. The real-weddings category page draws its post list by JavaScript; the newest features were found through the site's public WordPress posts listing and opened one by one.

