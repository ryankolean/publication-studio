          quote: as captured by our Guide member
        - source: feature_lucca
          quote: as designed by our Guide member
        - source: feature_joia_beach
          quote: See all the colorful photos by our photography Vendor Guide member
    - tip: Pitch the point of view; the editors want original, thoughtful, polished work and ask for a note on what makes the submission unique.
      cite:
        - source: guidelines
          quote: work that feels thoughtful, original, and executed with a high level of professionalism
        - source: guidelines
          quote: A note on what makes your submission unique
    - tip: Cover fashion as well as details, portraits, ceremony and reception; recent features dwell on bridal looks and outfit changes.
      cite:
        - source: guidelines
          quote: of detail shots, portraits, ceremony, reception, fashion, etc.
        - source: feature_surrealist_austria
        - source: feature_lucca
        - source: feature_da_nang
