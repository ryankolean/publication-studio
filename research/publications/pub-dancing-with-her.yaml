rights:
  image_usage:
    value: A perpetual, worldwide, royalty-free, transferable, sub-licensable license to use, adapt, reproduce and distribute submitted content in any media, including print, which becomes non-exclusive once the exclusivity period ends; it also covers the submitter's name, likeness and biography.
    cite:
      - source: terms
        quote: you hereby grant us a perpetual, non-exclusive (after the content exclusivity agreement has been met), royalty-free, fully paid, transferable, sub-licensable, worldwide license
      - source: terms
        quote: to use, adapt, display, publicize, reproduce, reformat, prepare derivative works of, distribute, and otherwise fully exploit your content in any media formats
      - source: terms
        quote: The license includes the right to incorporate the content in digital or print media
      - source: terms
        quote: the right to use your name, likeness, and biography in connection with the publication and promotion of the content
  credit_format:
    value: Attribution to the copyright holder; features end with a vendor credit list starting "Captured by" and the photographer, and social posts always tag the photographer and the creative wedding pros involved.
    cite:
      - source: terms
        quote: Content used on the site and in any publication will include attribution to the copyright holder.
      - source: guidelines
        quote: We will always tag the photographer, and any creative wedding pros who helped bring the story to life.
      - source: feature_lilydale
      - source: feature_queenstown
  couple_consent_required:
    value: unknown
    checked: [ guidelines, terms, form ]
    note: The guidelines say the editors gather the permissions they need after accepting a story, and the site footer says images, stories, pronouns and identities are used with permission, but no page says the submitter must have the couple's consent. The form's first step asks whether you are in the story or a vendor submitting it; its later steps were not read.
  vendor_consent_required:
    value: true
    cite:
      - source: terms
        quote: not submit content that is copyrighted unless you are the owner of such rights or have permission from the owner to submit the material
    note: The copyright owner's permission (usually the photographer's) when the submitter does not own the images; from the terms.

