      - source: terms
        quote: a period of twelve weeks from the date of publishing in our print and digital magazine title/s.
      - source: terms
        quote: the submitter of the content and the photographer agree not to distribute the content to other publications
    note: Six weeks (42 days) after the blog feature; twelve weeks (84 days) after publication in the print and digital magazine. Exclusivity during review is not stated.
