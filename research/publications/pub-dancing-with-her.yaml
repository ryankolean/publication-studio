routes:
  value:
    - platform: web_form
      url: https://submit.dancingwithher.com
      account_required: unknown
      preferred: true
      steps:
        - Check the Submit a Story page says submissions are open; they are sometimes closed to everyone except directory partners.
        - Open the online form from the Make a Submission button.
        - Choose Dancing With Her, Dancing With Them or either, and say whether you are in the story or a vendor submitting it.
        - Fill in the form with as much information as possible, then continue to the vendor credits.
        - If there is no reply after three weeks, follow up by email.
      note: Open on 2026-10-23; the page read "SUMBISSIONS ARE CURRENTLY OPEN" (sic). Submissions by Instagram or Facebook message are not accepted. The follow-up address is the general inbox, not a submissions inbox.
  cite:
    - source: guidelines
      quote: SUMBISSIONS ARE CURRENTLY OPEN
    - source: guidelines
      quote: From time to time we close submissions, only leaving them open for the partners inside our directory, so that we can keep up.
    - source: guidelines
      quote: We only accept submissions that come to us via our online form.
    - source: guidelines
      quote: We don’t accept submissions via Instagram or Facebook messages.
    - source: guidelines
      quote: When you’re filling out our submission form, please leave us with as much information as possible.
    - source: guidelines
      quote: If you haven’t heard from us after three weeks, please follow up via email
    - source: guidelines
      quote: MAKE A SUBMISSION
    - source: form
      quote: A wedding vendor submitting a story
    - source: form
      quote: Continue to vendor credits

