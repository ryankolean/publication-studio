id: pub-dancing-with-her
name: Dancing With Her
url: https://dancingwithher.com
kind: destination_international
tier: secondary
recheck_every_days: 30
taste_summary: Relaxed, personal LGBTQ+ weddings and elopements told in the couple's own words, often intimate, DIY and playful, with suits, pronouns and family stories front and centre.
notes: Submissions were open on 2026-10-23, but the outlet closes them from time to time to everyone except directory partners, so the route is rechecked monthly. The submission form (https://submit.dancingwithher.com) is drawn by JavaScript and its first step was read in a browser; later steps open only after details are entered and were not read. The contact page returned a bot-verification page and was not read. No real story has been published since 2026-08-12 (Real Stories listing read 2026-10-23); the newest posts are planning articles.

