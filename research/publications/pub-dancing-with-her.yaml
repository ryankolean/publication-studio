insight:
  secret_sauce:
    - tip: Check the queue before pitching; declines often come from a similar story already queued, too many weddings from the same area, or a style that does not fit.
      cite:
        - source: guidelines
          quote: Sometimes it is because we already have something similar in the publishing queue
        - source: guidelines
          quote: other times it is because we have had too many weddings from your area or because the style doesn’t quite fit into our publication.
    - tip: Tell the whole story, including the hard parts; the outlet shares the challenges as well as the good, including families who were not accepting and gender transitions.
      cite:
        - source: guidelines
          quote: aren’t shy about sharing the good, the challenges and everything in between.
        - source: interview
          quote: We share stories of couples who have had families who aren’t accepting of their relationship.
        - source: interview
          quote: We also share stories of people who are going through a gender transition.
    - tip: Have the couple ready to tell it in their own voice; stories are told through contributors' voices, and recent features run as a Q&A with the couple's pronouns.
      cite:
        - source: guidelines
          quote: We tell stories though the voices of its contributors
        - source: feature_lilydale
        - source: feature_brooklyn
    - tip: For print, offer something an issue lacks; each magazine is curated for diversity in sexuality, culture, religion, colours, style, budget and location.
      cite:
        - source: guidelines
          quote: each magazine is curated to include diversity in sexuality, culture, religion, colors, style, budget, locations
    - tip: Styled shoots need a real couple; ask the editors in advance if help finding an LGBTQ+ couple is needed.
      cite:
        - source: guidelines
          quote: we won’t accept submissions that include models posing as a couple.
        - source: guidelines
          quote: If you need help sourcing an LGBTQ+ couple for your styled shoot, let us know in advance
    - tip: A legal ceremony is not required; the founders said in 2019 they do not mind where the couple lives or whether marriage equality exists there.
      cite:
        - source: interview
          quote: We don’t care where you live, if you’ve had a legal ceremony or whether marriage equality doesn’t exist in your country.
