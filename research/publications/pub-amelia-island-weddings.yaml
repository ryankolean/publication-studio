insight:
  secret_sauce:
    - tip: A local connection helps; in the current issue, four of the five featured stories involve couples with connections to Amelia Island.
      cite:
        - source: issue_s26
          quote: In this issue, four of the five featured wedding stories have connections to Amelia Island
        - source: issue_s26
          quote: These couples have used their local connections to create unforgettable destination weddings for their family and friends.
    - tip: Stories cover the whole wedding weekend, from welcome parties to favorite local spots, not just the day itself.
      cite:
        - source: feature_peyton_luke
          quote: Like so many weddings on Amelia Island, the celebrations started well before the wedding day.
        - source: feature_peyton_luke
          quote: introduced visitors to some of their favorite local spots
        - source: feature_peyton_greg
          quote: The nuptials kicked off with a welcome party on Thursday evening at Kraft Athletic Club.
    - tip: The print issue's Wedding Scrapbook takes just one couple photo facing the camera, with names, wedding date and photographer.
      cite:
        - source: issue_s26
          quote: WEDDING SCRAPBOOK A peek into the wedding albums of some recent brides and grooms
        - source: scrapbook
          quote: To submit your couples photo (front facing the camera) please email a high resolution photo with your names, wedding date, and photographer’s name
