id: pub-amelia-island-weddings
name: Amelia Island Weddings Magazine
url: https://ameliaislandweddingsmagazine.com
kind: regional_magazine
tier: secondary
recheck_every_days: 180
taste_summary: Story-led features of Amelia Island weddings, many with local roots, written by staff writers from interviews; resort, church and marsh-front venues, with the photographer credited in the byline.
notes: The site answers 403 to the research verifier's user agent but serves pages to a standard client, which is how these pages were read on 2026-10-23. Masthead facts come from the Summer 2026 issue PDF linked from the site's current-issue page. Both submission routes are addressed to couples; neither mentions photographers.

