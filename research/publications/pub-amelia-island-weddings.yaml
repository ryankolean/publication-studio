routes:
  value:
    - platform: email
      account_required: false
      preferred: true
      steps:
        - Email the submissions inbox with your name, wedding date and wedding venue or venues.
        - Wait for the magazine to contact you for more information.
      note: The page is written to the couple ("your wedding story") and does not mention photographers. Stories may run online or in print. The inbox address is in the private contacts overlay.
    - platform: email
      account_required: false
      steps:
        - Email the same inbox one high-resolution photo of the couple facing the camera.
        - Include the couple's names, the wedding date and the photographer's name.
      note: For the print Wedding Scrapbook, a page of couple photos with names, wedding date and photographer. Addressed to married couples.
  cite:
    - source: submit
      quote: please send us an email with your name, wedding date, and weddings venue(s)
    - source: submit
      quote: we will contact you as soon as possible for more information
    - source: scrapbook
      quote: To submit your couples photo (front facing the camera) please email a high resolution photo with your names, wedding date, and photographer’s name
    - source: scrapbook
      quote: Amelia Island Weddings is looking for married couples to share their wedding day in our popular Scrapbook section.

