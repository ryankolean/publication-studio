coverage:
  regions:
    value:
      - US-FL:amelia-island
    cite:
      - source: submit
        quote: the many brides who chose Amelia Island as their wedding location
      - source: advertise
        quote: Amelia Island Weddings is the only wedding magazine devoted entirely to Amelia Island!
    note: Amelia Island only, by wedding location. The 2025 Sarah & Madison story was held just off the island, at the Ribault Club on Fort George Island in Jacksonville.
  basis:
    value: wedding_location
    cite:
      - source: submit
        quote: the many brides who chose Amelia Island as their wedding location
      - source: issue_s26
        quote: some of the terrific couples who have begun their lives together here on Amelia Island.
    note: The pages describe stories from couples who married on the island; the couple's home is not the test (recent couples lived in Brooklyn and Jacksonville).
  destination_accepted:
    value: true
    cite:
      - source: advertise
        quote: Amelia Island Weddings is the one resource that both local brides and destination brides count on
      - source: issue_s26
        quote: These couples have used their local connections to create unforgettable destination weddings for their family and friends.
      - source: feature_peyton_greg
        quote: In September 2020, Greg moved to New York City, where Peyton was already living
    note: Destination here means couples traveling to Amelia Island; the Peyton & Greg couple lived in New York and married at the Ritz-Carlton, Amelia Island.

