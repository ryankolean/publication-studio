id: pub-offbeat-wed
name: Offbeat Wed
url: https://offbeatwed.com
kind: blog
tier: secondary
recheck_every_days: 90
taste_summary: Identity-forward, nontraditional weddings (queer, polyamorous, BIPOC, neurodivergent, goth) told in the couple's own voice; since the 2026 pivot most new real weddings showcase its paid vendor members' work.
notes: Offbeat Wed (formerly Offbeat Bride) pivoted in 2026 from a couple-facing blog to a vendor-membership consultancy, and most new posts are now for vendors. The vendor submission instructions sit behind the member login and were not read, so package facts come from the public couple form. Feature publish dates come from each page's published-time metadata; the pages do not print a date.

