content:
  real_wedding:
    value: true
    cite:
      - source: guidelines
        quote: we do feature real wedding stories featuring the work of our members
      - source: reader_form
        quote: Submit your wedding for publication consideration
  elopement:
    value: unknown
    checked: [ guidelines, reader_form ]
  styled_shoot:
    value: true
    cite:
      - source: guidelines
        quote: If you’re a member of our vendor community, feel free to submit your client’s wedding, styled shoot, or a guestpost.
    note: Styled shoots come only through the paid vendor-member route.
  style_tags:
    value: [ alternative_nontraditional, bold_color_maximalist, playful_party, culturally_rooted, moody_dramatic, colored_printed ]
