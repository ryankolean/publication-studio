insight:
  secret_sauce:
    - tip: Send 75 to 100 of the strongest images in one consistent editing style; overstuffed galleries, heavy filters and a flood of dance-floor shots are passed over.
      cite:
        - source: guidelines
          quote: Overstuffed galleries (curation is everything)
        - source: guidelines
          quote: Dance floor overload (a few, not a flood)
        - source: guidelines
          quote: Photo galleries with multiple editing styles
    - tip: Lead with the love story; the editors name a compelling story and meaningful details first, and say budget does not matter.
      cite:
        - source: guidelines
          quote: A compelling love story + meaningful details
        - source: guidelines
          quote: Your wedding does not need to be of a million dollar budget to get featured.
    - tip: Include editorial portraits, couture fashion and beauty details, and clean detail shots of the bouquet, cake, stationery and tables.
      cite:
        - source: guidelines
          quote: We’re drawn to images that feel cinematic, chic, and intimate.
        - source: guidelines
          quote: Couture fashion and beauty details
        - source: guidelines
          quote: Clean compositions of bouquets, cakes, stationery, and tablescapes
    - tip: Make sure the gallery downloads without passwords or accounts; locked or broken galleries go to the back of the queue or are rejected.
      cite:
        - source: guidelines
          quote: If your gallery link is broken, locked behind password/account walls, or images can’t be downloaded, we’ll have to push your submission in the queue
    - tip: Show the cultural traditions and heritage attire; every recent real wedding centers them.
      cite:
        - source: about
          quote: we showcase the world’s most inspiring multicultural weddings
        - source: feature_dallas
        - source: feature_ghana
        - source: feature_arusha
    - tip: Coterie ties show up in recent features; three of the four newest real weddings name a Coterie member on the vendor team, and the guidelines ask submitters to flag one.
      cite:
        - source: guidelines
          quote: Make sure to indicate if you are a member or if a member worked on your wedding
        - source: feature_dallas
          quote: View his Coterie profile here
        - source: feature_arusha
          quote: Coterie Member Doreen Fitzpatrick of Sassyfly Luxury Events
        - source: feature_new_branch
          quote: a member of the Munaluchi Coterie
    - tip: For print, submit during an open Call for Submissions to hear back sooner.
      cite:
        - source: guidelines
          quote: If you submit your event during an open Call for Submissions , you can expect a response quicker.
