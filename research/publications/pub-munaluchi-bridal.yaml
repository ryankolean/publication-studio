routes:
  value:
    - platform: web_form
      url: https://www.munaluchibridal.com/submissions/
      account_required: unknown
      preferred: true
      steps:
        - Join the mailing list to hear when the next submission window opens.
        - While the Submissions Portal is open, complete the submission form and share the gallery link.
        - Include the curated images, full vendor credits and the couple's story.
        - Say whether you are a Coterie member or whether a member worked on the wedding.
        - Keep the Submissions ID number from the confirmation email to track the submission.
      note: Closed on 2026-10-23 and due to reopen early 2027; when open, the portal runs monthly for a short window. Every submission is reviewed for print first, then online. The form was not visible to read.
    - platform: portal
      account_required: true
      steps:
        - Apply for and join The Coterie, the paid vendor membership.
        - Submit the wedding through the Coterie Member Portal.
        - Expect a reply in about three weeks.
      note: Open only to paid Coterie members, and it stays open while the public portal is closed. The membership is recorded under economics.priority_paid_tier.
  cite:
    - source: guidelines
      quote: To be considered, complete the submission form below and share your gallery.
    - source: guidelines
      quote: Our Submissions Portal is open monthly for a short window.
    - source: guidelines
      quote: Our Submissions Portal is currently closed and will reopen early 2027.
    - source: guidelines
      quote: Coterie Members, you still have access to submit your work via your Member Portal.
    - source: guidelines
      quote: join our mailing list to be the first to receive our next Call for Submissions.
    - source: guidelines
      quote: you’ll receive an email that includes a Submissions ID number
    - source: guidelines
      quote: All submissions are reviewed for print first, then online
    - source: guidelines
      quote: Make sure to indicate if you are a member or if a member worked on your wedding

package:
  image_min:
    value: 75
    cite:
      - source: guidelines
        quote: "Weddings + Styled Shoots: 75–100 curated images"
    note: Engagement sessions take 25 to 50 images.
  image_max:
    value: 100
    cite:
      - source: guidelines
        quote: "Weddings + Styled Shoots: 75–100 curated images"
  resolution:
    value:
      min_width_px: 1200
      note: 72 dpi for online review; weddings chosen for print are asked for 8 x 12 inch files at 300 dpi.
    cite:
      - source: guidelines
        quote: "Image specs: minimum 1200px wide, 72 dpi"
      - source: guidelines
        quote: We’ll request hi-res images (8×12″, 300 dpi)
  size:
    value: web
    cite:
      - source: guidelines
        quote: No less than 1200px width, 72 dpi (for digital). For print features, we’ll request hi-res files
    note: Submit digital files; print files are requested only after a wedding is selected for print.
  orientation_mix:
    value: A mix of vertical and horizontal images.
    cite:
      - source: guidelines
        quote: A smart mix of verticals + horizontals
  watermarks_allowed:
    value: false
    cite:
      - source: guidelines
        quote: Watermarks? Never.
  gallery_hosts:
    value: unknown
    checked: [ guidelines ]
    note: No host is named; the gallery must download without passwords or accounts.
  vendor_credits:
    value:
      required: true
      fields: [ role, business_name, website, instagram ]
      note: Website and/or Instagram handle for each vendor.
    cite:
      - source: guidelines
        quote: "We require full vendor credits: names, roles, and websites urls and/or Instagram handles."
  story:
    value:
      required: true
      questionnaire: true
      note: A story goes in with the submission; the questionnaire is emailed only after acceptance.
    cite:
      - source: guidelines
        quote: Just share your gallery, credits, and story and we’ll take it from there.
      - source: guidelines
        quote: Every accepted submission requires a questionnaire + full vendor credits.
      - source: guidelines
        quote: If your submissions is accepted, we’ll email the questionnaire to you.
  video_accepted:
    value: unknown
    checked: [ guidelines ]
  other_requirements:
    value:
      - A gallery the editors can download without passwords or accounts.
      - Vendor permission, especially when the couple submits.
      - One consistent editing style, without special effects or heavy filters.
      - Engagement sessions are published only before the wedding has taken place.
    cite:
      - source: guidelines
        quote: If we can’t download your gallery easily (passwords missing, accounts required)
      - source: guidelines
        quote: Vendor permissions given (this is important if you are a couple submitting your event)
      - source: guidelines
        quote: Photo galleries with multiple editing styles
      - source: guidelines
        quote: Special effects and heavy filters
      - source: guidelines
        quote: For Engagement Sessions, we will publish if the wedding has not taken place yet.

rules:
  exclusivity:
    value:
      policy: exclusive_required
    cite:
      - source: guidelines
        quote: Do submissions need to be exclusive (not published elsewhere)?
      - source: guidelines
        quote: Yes. We only consider events that haven’t been featured in other publications (print or online), or heavily on social media.
  prior_exposure:
    publications:
      value: disqualifies
      cite:
        - source: guidelines
          quote: If your event was previously published in another magazine or on another website, it will not be considered for print or online.
    blogs:
      value: disqualifies
      cite:
        - source: guidelines
          quote: If your event was previously published in another magazine or on another website, it will not be considered for print or online.
      note: The rule covers any other website; no page carves out a vendor's own blog.
    social:
      value: sneak_peeks_only
      cite:
        - source: guidelines
          quote: Submissions that have been featured elsewhere or heavily on social media
      note: Only weddings shown heavily on social media are passed over; no page defines heavily.
  freshness_window_months:
    value: 12
    cite:
      - source: guidelines
        quote: For Weddings, the wedding date must be less than 12 months from the time you submit.
    note: The New Branch Farms feature (published May 2026) was of an August 2024 wedding.
  photographer_frequency:
    value: unknown
    checked: [ guidelines ]
  submitter_roles:
    value: [ couple, photographer, planner, vendor ]
    cite:
      - source: guidelines
        quote: Whether you’re the couple or a you’re a part of the vendor team (photographer, planner, designer, etc.), you’re welcome to submit.

rights:
  image_usage:
    value: A worldwide, royalty-free license to use, reproduce and display submitted content across Munaluchi's media channels, with credit when practicable; possible partner publication features, with notice first; most web features later run on Instagram.
    cite:
      - source: terms
        quote: you grant Munaluchi a worldwide, royalty-free license to use, reproduce, and display your content (with credit when practicable) across our media channels.
      - source: guidelines
        quote: By submitting, you agree to our Terms & Conditions, including possible partner publication features (you’ll always be notified first.)
      - source: guidelines
        quote: most events featured on our website will eventually be featured on social.
  credit_format:
    value: A Wedding team list credits each vendor by role, name and Instagram handle, with do-follow links; Instagram captions may not list every vendor, and caption mentions are guaranteed only to advertisers.
    cite:
      - source: guidelines
        quote: Our website links are do-follow , giving each professional credit with some SEO power.
      - source: guidelines
        quote: We may not list every single vendor that worked the weddings in the IG caption
      - source: guidelines
        quote: We only guarantee Instagram mentions in captions for our advertisers.
      - source: feature_dallas
        quote: "Photography: Stanlo Photography | @stanlophotography"
  couple_consent_required:
    value: unknown
    checked: [ guidelines, terms ]
  vendor_consent_required:
    value: true
    cite:
      - source: guidelines
        quote: Just be sure you have permission from any vendors involved, and complete all required credits.

