id: pub-munaluchi-bridal
name: Munaluchi Bride
url: https://www.munaluchibridal.com
kind: national_magazine
tier: secondary
recheck_every_days: 60
taste_summary: Multicultural, couture-minded weddings that center heritage traditions and cultural attire, shot with editorial polish; real weddings get first call for the print issues.
notes: The public Submissions Portal was closed on 2026-10-23 (reopening early 2027), so the form itself could not be read. The nav Advertise link (https://www.munaluchibridal.com/?page_id=3061) and /advertise/ returned 404, and no media kit was found. The Coterie membership page draws its text with JavaScript; its prices were read from the data embedded in the page and need a browser check.

