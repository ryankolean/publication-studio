id: pub-wedluxe
name: WedLuxe
url: https://wedluxe.com
kind: destination_international
tier: secondary
recheck_every_days: 90
taste_summary: Global luxury weddings told as editorial stories, recently Italian villa and Lake Como weekends and Asian resort weddings, with couture, candlelit long tables and soft romantic florals.
notes: Real weddings go through the public portal at submissions.wedluxe.com, which needs no sign-in; its rules and gating messages were read from the portal page and its two script files (form_script, form_options). The portal footer reads "Review artifact" and "Production form and records remain unchanged" while the form itself is labelled a production submission form, so confirm the portal is still the live route at the next recheck. Styled shoots are a paid editorial path, not part of the free form. No about, advertise or masthead page is linked from the home page, so editors and reach are unknown.

