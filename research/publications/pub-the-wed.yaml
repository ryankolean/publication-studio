insight:
  secret_sauce:
    - tip: Pitch boldness. The editors look for striking design, originality, a clear creative concept and weddings that push boundaries and tell a story.
      cite:
        - source: howto
          quote: What do we look for when curating our features? Boldness.
        - source: howto
          quote: We love striking design choices, originality, clear creative concepts and weddings that push boundaries and tell a story.
    - tip: Send complete details; the most thorough submissions review more smoothly and stand a better chance of being featured.
      cite:
        - source: howto
          quote: The strongest submissions always include thoughtful and complete details.
        - source: howto
          quote: the greater the chance that your wedding will be featured on THE WED.
    - tip: Flag any THE WED member on the vendor team; submissions involving members get priority review and the feature links to the member's directory profile.
      cite:
        - source: howto
          quote: If you, your venue or someone on the vendor team are also a member of THE WED, please highlight this in your submission form
        - source: howto
          quote: While priority review is given to submissions involving THE WED members
    - tip: Have the couple ready for the interview; the feature is scheduled only after their Q&A answers are in.
      cite:
        - source: howto
          quote: As we need the completed answers before scheduling a wedding for publication, the timeline depends in part on when we receive them.
    - tip: A decline is not final; the editors encourage vendors to keep submitting future projects.
      cite:
        - source: howto
          quote: we encourage every vendor to continue to submit future projects that align with THE WED vision.
  recent_features:
