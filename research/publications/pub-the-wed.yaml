rights:
  image_usage:
    value: Published under the permissions and licenses granted through the submission process; creators keep ownership. A Real Wedding Agreement signed after acceptance sets image usage, exclusivity periods and social sharing.
    cite:
      - source: terms
        quote: THE WED publishes such works on the basis of permissions and licenses granted through the content submission process
      - source: terms
        quote: does not claim any ownership interest in third-party creative works.
      - source: howto
        quote: It outlines the key terms surrounding the feature, including image usage, exclusivity periods, social media sharing and other important details related to publication.
  credit_format:
    value: A credits list at the end of the feature naming each vendor by role, such as Photographer and Venue; the couple, venues and vendors are tagged on social channels.
    cite:
      - source: feature_rome
        quote: "Photographer: Katarina Fedora"
      - source: howto
        quote: featured across our social channels, with the couple, venues and vendor all tagged accordingly.
  couple_consent_required:
    value: unknown
    checked: [ howto, form, terms ]
    note: The couple is interviewed after acceptance; no page asks for the couple's consent at submission.
  vendor_consent_required:
    value: true
    cite:
      - source: howto
        quote: we just ask that you first coordinate with your photographer and planner before submitting, to ensure that permissions, credits, and details are all in order.
    note: The photographer's and planner's permission, arranged before submitting.

