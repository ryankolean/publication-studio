routes:
  value:
    - platform: web_form
      url: https://thewed.com/submissions
      account_required: false
      preferred: true
      steps:
        - Coordinate with the photographer and planner before submitting.
        - Open the online submission form from the submissions page.
        - Fill in who is submitting, the gallery link, the submission type, the venue or location, a description and the vendor credits.
        - Answer whether the wedding was previously published and whether anyone on the team is a THE WED member.
        - Agree to the privacy policy or terms of use and send.
        - Expect contact within 14 business days, and only if the submission is accepted.
      note: The form shows no sign-in step. Submissions involving THE WED members get priority review.
  cite:
    - source: howto
      quote: Your journey begins with our online submission form
    - source: howto
      quote: we just ask that you first coordinate with your photographer and planner before submitting
    - source: form
      quote: Has this wedding been previously published? *
    - source: form
      quote: Is anyone from the team a member of THE WED?
    - source: guidelines
      quote: only successful applicants will be contacted within 14 business days.
    - source: form
      quote: Submitted By *
    - source: form
      quote: Link to the Image Gallery *
    - source: form
      quote: Submissions Type *
    - source: form
      quote: Venue/Location *
    - source: form
      quote: Description *
    - source: form
      quote: Vendor Credits *
    - source: form
      quote: I agree with the Privacy Policy or Terms of Use

package:
  image_min:
    value: 100
    cite:
      - source: howto
        quote: Galleries should include a minimum of 100 images showcasing the full span of the wedding day or weekend as they unfolded
  image_max:
    value: unknown
    checked: [ howto, form ]
  resolution:
    value: unknown
    checked: [ howto, form ]
    note: The guide asks only that images be high-resolution; no pixel or file-size figures are given.
  size:
    value: unknown
    checked: [ howto, form ]
    note: The guide asks for high-resolution images but does not say web or print.
  orientation_mix:
    value: unknown
    checked: [ howto, form ]
  watermarks_allowed:
    value: unknown
    checked: [ howto, form ]
  gallery_hosts:
    value: any
    cite:
      - source: howto
        quote: Provide a working link to your photo gallery with full access, including any necessary passwords or login details
      - source: form
        quote: Link to the Image Gallery *
    note: No host is named or refused; the form takes a gallery link plus an optional gallery username and password.
  vendor_credits:
    value:
      required: true
      fields: [ business_name, website ]
      note: Social links are also asked for; no platform is named.
    cite:
      - source: howto
        quote: be sure to include the complete list of vendors with their correct names, websites and social links.
      - source: form
        quote: Vendor Credits *
  story:
    value:
      required: true
      questionnaire: true
      note: The form needs a description of the event; after acceptance the editors interview the couple through a Q&A, which must be complete before the feature is scheduled.
    cite:
      - source: form
        quote: Description *
      - source: howto
        quote: The next step is the couple’s Q&A, which plays an essential role in shaping the final feature.
  video_accepted:
    value: true
    cite:
      - source: form
        quote: Link to the Video
    note: The video link is optional.
  other_requirements:
    value:
      - Images covering the full span of the day or weekend, from detail shots and wide captures to behind-the-scenes moments and couple portraits.
      - Full gallery access, with any passwords or login details.
      - The submitter's Instagram account.
      - The venue or location.
      - Say whether anyone on the team is a THE WED member, so the feature links to their directory profile.
    cite:
      - source: howto
        quote: from strong detail shots to wide-angle captures, raw behind-the-scenes moments and couple portraits
      - source: howto
        quote: Provide a working link to your photo gallery with full access, including any necessary passwords or login details
      - source: form
        quote: Instagram *
      - source: form
        quote: Venue/Location *
      - source: howto
        quote: please highlight this in your submission form to ensure the feature connects with the member's Directory profile

