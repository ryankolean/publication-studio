id: pub-the-wed
name: THE WED
url: https://thewed.com
kind: destination_international
tier: primary
recheck_every_days: 90
taste_summary: Bold, fashion-led luxury weddings abroad, mostly Italy and Spain, with couture and multiple looks, sculptural florals, historic villas and castles, and full couple Q&A stories.
notes: The Submit Now button opens a form drawn by JavaScript; its fields were read from the page's own script file (source form), whose hashed file name changes with each site build, so re-read it through the submissions page. The contacts page lists only general and venue inboxes, hidden behind an email-protection script. Membership is by application and invitation; no price is published.

