        quote: For videos, you can provide Vimeo and YouTube links.
  other_requirements:
    value:
      - The submitter's Instagram handle.
      - A yes or no answer confirming the submitter is authorized to submit the images.
    cite:
      - source: form
        quote: Your Instagram handle
      - source: form
        quote: I am authorized to submit these images (Yes / No)

rules:
  exclusivity:
    value:
      policy: exclusive_preferred
      after_publication_days: 60
    cite:
      - source: guidelines
        quote: We simply ask that any other feature is not posted until 2 months after the Wed Vibes feature.
    note: Two months after publication, stored as 60 days; submitting elsewhere is welcome after that.
  prior_exposure:
    publications:
      value: allowed
      cite:
        - source: guidelines
          quote: We prefer stories that haven’t been published elsewhere, but we’re always open to exceptions for the right submission.
