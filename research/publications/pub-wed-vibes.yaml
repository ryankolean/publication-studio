insight:
  secret_sauce:
    - tip: Lead with polished, trend-aware images; the owners describe the content they publish as stylish, smart, likable, saveable and sellable.
      cite:
        - source: owners_interview
          quote: Our content strategy focuses on creating the most ‘stylish, smart, likable, saveable, and sellable’ content
    - tip: Have the facts each feature prints up front (location, style, guest count, planning time, setting, season) plus the couple's advice and a full vendor list.
      cite:
        - source: feature_brazil
        - source: feature_malta
        - source: feature_paris
    - tip: Paid community members are prominent; each recent feature opens with a Featured Members box, and the paid community plans advertise an extra website and Instagram feature.
      cite:
        - source: community
          quote: "Opportunity for extra website & IG feature: a WedVibes Contributor"
        - source: feature_lake_como
        - source: feature_brazil
    - tip: A decline is not final; the editors invite photographers to keep sending other weddings.
      cite:
        - source: guidelines
          quote: we encourage you to please keep in touch and send through any other submissions for consideration in future.
  recent_features:
    - source: feature_lake_como
