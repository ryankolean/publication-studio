id: pub-wed-vibes
name: Wed Vibes
url: https://wedvibes.media
kind: destination_international
tier: secondary
recheck_every_days: 90
taste_summary: Design-led destination weekends and European palazzo and villa weddings, often with fashion credits, cultural traditions and playful party details.
notes: The live site is wedvibes.media; wedvibes.com is a parked for-sale domain. The submission form is drawn by a script and fetches empty; it was read in a browser on 2026-10-23. Wed Vibes also sells paid group editorials, a paid community membership and a paid feature product.

