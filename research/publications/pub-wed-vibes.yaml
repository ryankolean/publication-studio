routes:
  value:
    - platform: web_form
      url: https://wedvibes.media/submissions/
      account_required: false
      preferred: true
      steps:
        - Open the submissions page; the form is on the page, no sign-in.
        - Give your name, email, Instagram handle, a gallery link with 100 to 150 of the best images, and a description.
        - Confirm you are authorized to submit the images, then submit.
        - Allow 21 business days; only successful submissions hear back.
    - platform: web_form
      url: https://wedvibes.media/contact-us/
      account_required: false
      preferred: false
      steps:
        - Fill out the general contact form, which also takes wedding submissions.
  cite:
    - source: form
      quote: Please submit 100-150 of the very best photos
    - source: contact
      quote: "Please, for general inquiries, wedding submissions, or advertising opportunities, fill out the form below:"

package:
  image_min:
    value: 100
    cite:
      - source: form
        quote: Please submit 100-150 of the very best photos
  image_max:
    value: 150
    cite:
      - source: form
        quote: Please submit 100-150 of the very best photos
  resolution:
    value:
      min_width_px: 1500
      max_width_px: 2400
      max_file_mb: 2
      note: The width range is a recommendation; 2MB is the stated maximum file size.
    cite:
      - source: form
        quote: we recommend that your images have a width between 1500 and 2400 pixels
      - source: form
        quote: The maximum file size allowed is 2MB.
  size:
    value: unknown
    checked: [ form, guidelines ]
    note: The form never says web or print; its 2MB cap and 1500 to 2400 pixel width describe web-size files.
  orientation_mix:
    value: unknown
    checked: [ guidelines ]
  watermarks_allowed:
    value: unknown
    checked: [ guidelines ]
  gallery_hosts:
    value: [ dropbox, wetransfer, google_drive, pic_time, pixieset ]
    cite:
      - source: form
        quote: You can share your portfolio with us using platforms like Dropbox, WeTransfer, Google Drive, or online gallery services such as Pic-Time or Pixieset.
  vendor_credits:
    value: unknown
    checked: [ form, guidelines ]
    note: The form has no vendor field; published features close with a full vendor credit list.
  story:
    value:
      required: true
      note: A required Description field. Published features open with a fact box (location, style, guests, planning time, setting, season) and close with the couple's advice.
    cite:
      - source: form
        quote: Description
  video_accepted:
    value: true
    cite:
