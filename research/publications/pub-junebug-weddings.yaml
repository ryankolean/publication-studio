routes:
  value:
    - platform: portal
      url: https://junebugweddings.com/apply-for-membership
      account_required: true
      preferred: true
      steps:
        - Apply for a listing in the Junebug vendor directory and wait for approval.
        - Once listed, open the submission form inside your Junebug account.
        - Submit the wedding, elopement or styled shoot there.
      note: Open only to listed Junebug Vendors, a paid 12-month directory listing.
  cite:
    - source: guidelines
      quote: Editorial submissions are now open exclusively to Junebug Vendors.
    - source: guidelines
      quote: you can find the submission form inside your Junebug account.
    - source: membership
      quote: please complete our application below and a team member will get back to you within ten business days.
    - source: guidelines
      quote: "Latest Editorial Update: October 23rd, 2024"

