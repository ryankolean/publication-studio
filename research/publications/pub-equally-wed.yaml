insight:
  secret_sauce:
    - tip: Send the questionnaire complete, with every answer gathered from the couple and the vendors; the editors will not chase missing details.
      cite:
        - source: submittable
          quote: We receive hundreds of submissions and we cannot follow up with your couples on your behalf.
    - tip: Cover the whole day, from getting ready and details to the ceremony and the reception, and favor details over guest shots.
      cite:
        - source: submittable
          quote: More details, less wedding guests.
    - tip: Get the couple to answer in their own words; recent features are built around their quotes on the love story, the proposal and advice for vendors serving LGBTQ+ couples.
      cite:
        - source: feature_boulder
          quote: Advice for Vendors and Venues
        - source: feature_queenstown
          quote: The newlyweds offer this advice to vendors and wedding professionals working with the LGBTQ+ community
    - tip: For styled shoots, cast real LGBTQ+ people and show ideas the real-wedding section lacks; preferred vendors get styled shoots accepted more readily.
      cite:
        - source: submittable
          quote: We're looking for inspiration that our couples might not see in our Real Weddings section.
        - source: submittable
          quote: We accept styled shoots more readily from our preferred vendors who are already part of the Equally Wed family.
