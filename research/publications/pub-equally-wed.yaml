    cite:
      - source: submittable
        quote: We do not accept weddings earlier than 2020.
      - source: submittable
        quote: We do not publish weddings at plantations.
      - source: submittable
        quote: Submit a variety of professional photos showcasing the entire event
      - source: submittable
        quote: More details, less wedding guests.

