routes:
  value:
    - platform: portal
      url: https://equallywed.submittable.com/submit
      account_required: true
      preferred: true
      steps:
        - Open the Equally Wed Submission Manager on Submittable.
        - Choose the Real Wedding Submissions form (or Engagement Submissions, Styled Shoots or Expert Advice).
        - Sign in to a Submittable account.
        - Fill in the full wedding questionnaire with the couple's and vendors' answers.
        - Add at least 15 professional images covering the whole day, mostly horizontal and in color.
        - Submit.
      note: Every Submit link on the public listing redirects to the Submittable account login, so the forms were not viewed. Couples submit through the same forms.
  cite:
    - source: submittable
      quote: Please use one of our submission forms below to submit to Equally Wed.
    - source: guidelines
      quote: Please click the button below to submit weddings, engagements, styled shoots, expert advice, etc. to us!
    - source: submittable
      quote: For couples and marriers wishing to submit, you can do so through the forms below as well.

