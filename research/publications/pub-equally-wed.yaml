id: pub-equally-wed
name: Equally Wed
url: https://equallywed.com
kind: blog
tier: secondary
recheck_every_days: 90
taste_summary: LGBTQ+ weddings and elopements told through the couple's own words, often intimate, outdoors and far from home, with the journey to a legal marriage at the center.
notes: The site invites "your LGBTQ+ wedding" and styled shoots must use real LGBTQ+ people, so this outlet only fits LGBTQ+ couples. The submission forms sit behind a Submittable account login and were not viewed; package facts come from the guidelines on the public Submittable listing. Feature publish dates come from each page's published-time metadata; the pages do not print a date. The media kit is sent only by email request.

