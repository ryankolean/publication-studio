id: pub-vogue-weddings
name: Vogue Weddings
url: https://www.vogue.com/weddings
kind: national_magazine
tier: dream
recheck_every_days: 90
taste_summary: Fashion-led real weddings told through the clothes, with designer, vintage and custom looks and several outfit changes per couple; mixes celebrities with stylish private couples.
notes: >-
  No public submission route was found: the contact page and FAQ cover subscriptions only, and the about and masthead pages name no submissions process. The masthead (dated September 2026) lists Liam Hess as Senior Lifestyle and Weddings Editor. Real weddings run as photo slideshows several times a week; captions are written in the couple's own voice. Of the features read that give a wedding date, they ran about 2.5 and 6.5 months after the wedding. A Business of Fashion article on Vogue's wedding coverage returned 403 and was not used.

