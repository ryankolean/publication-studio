insight:
  secret_sauce:
    - tip: >-
        Lead with the clothes. Headlines name the designers, and at least four of the five features read follow the couple through several looks or outfit changes, with vintage and custom pieces recurring.
      cite:
        - source: feature_palm_beach
        - source: feature_seattle
        - source: feature_mexico_city
        - source: feature_newport
    - tip: >-
        Captions run in the couple's own words beside each photo, so a couple who can speak to every look and moment fits the format.
      cite:
        - source: feature_mexico_city
          quote: Nikki Reynen at Raffe Vintage found this spring 2008 Valentino dress for me
        - source: feature_newport
          quote: I always knew I wanted a second look for my reception
