routes:
  value:
    - platform: web_form
      url: https://www.insideweddings.com/wedding/submit/
      account_required: false
      preferred: true
      steps:
        - Open the Submit Your Wedding form and fill out every field.
        - Give a link to 50 to 100 photos showing the style of the wedding and the detail and decoration of the ceremony and reception.
        - Confirm the couple is aware of the submission and its terms.
        - Confirm the wedding has not been submitted to or accepted by another print publication or a commercial blog.
        - Note a preference for print or web, if there is one.
      note: The form sits on a public page with no sign-in step. The about page says submissions are accepted only through this form.
  cite:
    - source: about
      quote: "Legitimate submissions are accepted only through our official channels:"
    - source: submit
      quote: Please fill out all fields on the submission form to provide us with a sense of the overall event.
    - source: submit
      quote: Please provide us with 50-100 photos that reflect the style of the wedding
    - source: submit
      quote: the detail and decoration elements of both the ceremony and reception.
    - source: submit
      quote: "Please confirm that the couple is aware that:"
    - source: submit
      quote: has not been submitted or accepted for print by another print publication.
    - source: submit
      quote: has not been submitted or accepted for a feature on a commercial blog.
    - source: submit
      quote: if you have a preference for one over the other, please note it in the submission.

