    note: Recent features carry the bylines Nicole Palacios and Kelcy Christy with no titles; the about page mentions an Editor-in-Chief without a name.

insight:
  secret_sauce:
    - tip: Build the selection around decor, details and the venues, and keep couple portraits to a few.
      cite:
        - source: submit
          quote: photos that focus mainly on the décor, details, and venue(s) of the event
        - source: submit
          quote: couple shots should be included, but limited in number.
    - tip: Complete every field; the editors judge the whole event from the form.
      cite:
        - source: submit
          quote: Please fill out all fields on the submission form to provide us with a sense of the overall event.
    - tip: Aim at the upscale market; half of each issue is upscale real weddings with every vendor credited.
      cite:
        - source: about
          quote: devotes half of its pages to showcasing the upscale weddings of real couples.
        - source: about
          quote: provide readers with all vendor information to help brides plan their own wedding.
    - tip: Prepare the couple for a cost survey; the media kit says the featured couples' financial survey is required for publication.
      cite:
        - source: kit
          quote: "Source: Featured couples financial survey required for publication."
        - source: submit
          quote: if their wedding is selected, they will be asked to provide cost information relating to the event that will be used for research purposes only.
  recent_features: []
