id: pub-inside-weddings
name: Inside Weddings
url: https://www.insideweddings.com
kind: national_magazine
tier: secondary
recheck_every_days: 90
taste_summary: Upscale, decor-led real weddings with full vendor lists; recent features are ballroom, country club, tented and garden celebrations with lavish florals, mostly in the US.
notes: Feature pages show no publication date, and the weddings sitemap carries update dates, not publish dates, so recent_features is empty; the features stay cited for style tags. The terms of use are drawn by a third-party script and fetch empty without a browser; they were read in a headless browser render. Media kit facts come from the 2025 PDF media kit linked from the advertise page.

