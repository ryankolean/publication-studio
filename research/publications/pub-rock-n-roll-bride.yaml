id: pub-rock-n-roll-bride
name: Rock n Roll Bride
url: https://www.rocknrollbride.com
kind: destination_international
tier: secondary
recheck_every_days: 90
taste_summary: Alternative, rule-breaking weddings with big personality, colour, gothic and punk streaks, DIY and budget-conscious celebrations, inclusive of queer and neurodivergent couples; online most weekdays plus a bi-monthly print magazine.
notes: UK title (Reading). US weddings are published often (three of the newest five features are in Oregon and Florida, and US features are tagged "America"). No page sets a geographic limit or mentions weddings abroad in its rules; the site runs a "Destination weddings" section, and a recent feature shows a London couple who flew to the Philippines for a celebration it calls a destination wedding. The submissions inbox and the editor's address are in the private contacts overlay. A podcast interview with the editor (Weddings Unveiled, evergreenpodcasts.com) returned HTTP 403 and was not read.

