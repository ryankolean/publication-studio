routes:
  value:
    - platform: email
      account_required: false
      preferred: true
      steps:
        - Email the magazine inbox after the wedding has taken place.
        - Attach 10 to 20 low-res images, or link an online gallery (for Dropbox, send a direct link to the folder rather than an invitation).
        - Include portraits of the couple and detail shots, with no watermarks.
        - Give the couple's names, the wedding date and the location.
        - Add a short paragraph or a few bullet points on why the wedding suits Rock n Roll Bride and what makes it stand out.
        - Expect a yes or no in 2 to 3 working days; follow up if nothing arrives within a week.
        - If accepted, send the full gallery, have the couple complete the questionnaire and the photographer sign the permission form.
      note: Photo shoots go to the same inbox with a link to high-res 300 DPI images, a supplier list (business name, Instagram handle and role) and a short pitch. The inbox and editor addresses are in the private contacts overlay.
  cite:
    - source: guidelines
      quote: Please submit your wedding AFTER it has already taken place.
    - source: guidelines
      quote: Drop us an email and include the following info
    - source: contact
      quote: For real wedding submissions, freelance writing opportunities, advertising info, brand collaborations, press enquires, messages of love and everything in between
    - source: guidelines
      quote: If the submission is accepted we will then ask you to send the full gallery.
    - source: guidelines
      quote: Between 10 and 20 low res images.
    - source: guidelines
      quote: Images can be sent attached to an email or linked to an external online gallery.
    - source: guidelines
      quote: please email a direct link to the folder itself rather than inviting us to a folder within Dropbox
    - source: guidelines
      quote: Please include portraits of the couple and detail shots (the cake, centrepieces, decorations etc).
    - source: guidelines
      quote: Images must not have watermarks on them.
    - source: guidelines
      quote: The couple’s names, wedding date and location
    - source: guidelines
      quote: A short paragraph or a few bullet points laying out why you think this wedding is perfect for Rock n Roll Bride
    - source: guidelines
      quote: You will hear back, usually within 2-3 working days, whether your submission is successful or not.
    - source: guidelines
      quote: If you haven’t heard back within a week, feel free to send a follow-up
    - source: guidelines
      quote: Weddings cannot be featured without the questionnaire filled in by the couple and the signed permission form.

