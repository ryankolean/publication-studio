rules:
  exclusivity:
    value:
      policy: exclusive_required
      during_review: true
    cite:
      - source: guidelines
        quote: We require FIRST SHOWING EXCLUSIVITY of all our real wedding features
      - source: guidelines
        quote: Please do not submit anything that is currently pending with another publication.
      - source: guidelines
        quote: We do not expect the images to be held back for any specified period of time after our feature.
    note: First showing only; the wedding may go to other outlets as soon as the feature is live. The editors occasionally bend the rule, so disclose any earlier submission or feature.
  prior_exposure:
    publications:
      value: disqualifies
      cite:
        - source: guidelines
          quote: Rock n Roll Bride will only publish weddings that have not been previously featured on any other wedding blogs or magazines.
      note: Rare exceptions are made; photo shoots featured elsewhere are judged case by case.
    blogs:
      value: allowed
      cite:
        - source: guidelines
          quote: You are very welcome to publish the images on your own blog, website or social media
      note: If another blog, magazine or publisher picks the images up, the feature may be at risk.
    social:
      value: allowed
      cite:
        - source: guidelines
          quote: You are very welcome to publish the images on your own blog, website or social media
  freshness_window_months:
    value: none
    cite:
      - source: guidelines
        quote: there is no time limit on submitting, and it doesn’t matter if you got married yesterday or three years ago
  photographer_frequency:
    value: unknown
    checked: [ guidelines ]
  submitter_roles:
    value: [ photographer, couple, vendor ]
    cite:
      - source: guidelines
        quote: We accept real wedding submissions from photographers, newlyweds or any wedding supplier involved in the day.

rights:
  image_usage:
    value: Published online or in the print magazine, with the editors deciding the placement; a photography credit runs wherever an image is published.
    cite:
      - source: guidelines
        quote: While we will make the final decision on whether a feature is placed in print or online
      - source: guidelines
        quote: A photography credit will always be included wherever an image is published.
    note: Submitters may state a print preference, which is taken into account.
  credit_format:
    value: The photographer is named under the headline, and a Suppliers list at the end gives each role and business, starting with Photography.
    cite:
      - source: guidelines
        quote: A photography credit will always be included wherever an image is published.
      - source: feature_western_pixies
        quote: "Photography: O&C Photography"
  couple_consent_required:
    value: true
    cite:
      - source: guidelines
        quote: Permission to be featured from both the photographer and the couple is imperative
  vendor_consent_required:
    value: true
    cite:
      - source: guidelines
        quote: Permission to be featured from both the photographer and the couple is imperative
      - source: guidelines
        quote: the image copyright holder (typically the photographer) will be required to sign a permission form before we share any images.
    note: The photographer's permission, as the image copyright holder, given on a signed form.

