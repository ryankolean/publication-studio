      max: 120
    cite:
      - source: guidelines
        quote: Our current lead time for publication is around three months for online features and two issues (four months) for print features.
    note: About 90 days for online features and about 120 for print.
  publishing_cycle:
    value: Online, with a new real wedding most weekdays (five went live from 2026-10-19 to 2026-10-23), plus a bi-monthly print magazine distributed internationally.
    cite:
      - source: advertising
        quote: our print magazine is one of the only bi-monthly, internationally distributed print magazines left in the UK
      - source: feature_western_pixies
      - source: feature_portland_castle
      - source: feature_suwannee
      - source: feature_working_mens_club
      - source: feature_goths_beach

