insight:
  secret_sauce:
    - tip: Lead the email with why the wedding is right for Rock n Roll Bride and what makes it stand out.
      cite:
        - source: guidelines
          quote: laying out why you think this wedding is perfect for Rock n Roll Bride and anything that makes it particularly stand out.
    - tip: Send colour images, portraits of the couple and detail shots such as the cake, centrepieces and decorations.
      cite:
        - source: guidelines
          quote: Please include portraits of the couple and detail shots (the cake, centrepieces, decorations etc).
        - source: guidelines
          quote: Colour images are generally preferred over black and white.
    - tip: The editors list what they love - happy, smiley couples, creative portraits, colour, unique details, fashion and personal style, and pets at weddings.
      cite:
        - source: guidelines
          quote: Happy, smiley couples in love.
        - source: guidelines
          quote: Creative and beautiful portraits.
        - source: guidelines
          quote: Unique wedding details (cakes, centrepieces, flowers etc).
        - source: guidelines
          quote: Incredible fashion and personal style.
        - source: guidelines
          quote: Pets at weddings. Honestly, the more the better.
    - tip: Older weddings are welcome; there is no time limit, even three years after the date.
      cite:
        - source: guidelines
          quote: there is no time limit on submitting, and it doesn’t matter if you got married yesterday or three years ago
    - tip: Prefer real weddings over styled shoots; real wedding stories get priority for publication.
      cite:
        - source: guidelines
          quote: real wedding stories are given priority for publication
    - tip: For Dropbox, send a direct link to the folder; folder invitations can be missed.
      cite:
        - source: guidelines
          quote: rather than inviting us to a folder within Dropbox (as these can often be missed).
    - tip: Lean into individuality and inclusivity; the title champions self-expression and underrepresented couples.
      cite:
        - source: guidelines
          quote: We champion individuality, inclusivity, and self-expression
        - source: about
          quote: We’re here to represent the underrepresented.
