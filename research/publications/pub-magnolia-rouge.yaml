routes:
  value:
    - platform: portal
      url: https://magnoliarouge.com/dashboard/submissions/
      account_required: unknown
      preferred: true
      steps:
        - Open the Submissions section, linked from the contact page and the site header.
        - Submit the wedding or editorial through the submissions dashboard.
        - Once a wedding is chosen for a feature, the couple fills in the Real Wedding Questionnaire with their story and a full vendor list.
      note: The submissions page sits under the site's account dashboard and returned a bot challenge, so it was not read and whether a free account is needed is not confirmed here. Vendor Collective members get a fast-track simplified submission process.
  cite:
    - source: contact
      quote: For information about submissions, see the Submissions section.
    - source: questionnaire
      quote: We are thrilled to be featuring your wedding on Magnolia Rouge
    - source: advertising
      quote: As a Magnolia Rouge Collective member, you’ll also get priority consideration for submissions and a fast-track simplified submission process.

