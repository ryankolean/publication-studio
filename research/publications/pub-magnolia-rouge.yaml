insight:
  secret_sauce:
    - tip: Join the Vendor Collective if the budget allows; members' submissions are considered first, go through a simpler fast-track process, and get members-only call-outs for submissions.
      cite:
        - source: advertising
          quote: As a Magnolia Rouge Collective member, you’ll also get priority consideration for submissions and a fast-track simplified submission process.
        - source: advertising
          quote: We send exclusive call outs in our Facebook group to our vendor community to recruit image submissions on certain topics.
    - tip: Match the house look of natural beauty, organic styling and romance; the editor curates for an intentional, consistent aesthetic.
      cite:
        - source: home
          quote: Magnolia Rouge celebrates natural beauty, organic styling, and inspiring imagery.
        - source: about
          quote: has quickly become a website and magazine synonymous with romance, style, and exquisite photography.
        - source: advertising
          quote: Kate, our editor, does such a beautiful job of curating an editorial with an intentional, consistent aesthetic.
    - tip: Collect every vendor's business name, website and Instagram before the couple fills in the questionnaire; only vendors listed there are credited.
      cite:
        - source: questionnaire
          quote: Please add (or paste) all your vendor information here (business name, website and instagram).
        - source: questionnaire
          quote: We will only add vendors you have listed here so please ensure you include everyone you’d like acknowledged.
    - tip: Brief the couple to share their story in detail; the questionnaire says there is no such thing as too much information.
      cite:
        - source: questionnaire
          quote: Please give us a rundown on the aspects that you are comfortable sharing (there is no such thing as too much information).
  recent_features:
    - source: feature_talloires
      published: 2026-10-14
      location: FR
      content_type: real_wedding
