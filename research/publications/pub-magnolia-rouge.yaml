rights:
  image_usage:
    value: A non-exclusive, royalty-free, transferable, sublicensable, worldwide license to use, adapt and distribute submitted content through any media; it ends when the content is removed, except for content already sublicensed. Magnolia Rouge claims no ownership.
    cite:
      - source: terms
        quote: a non-exclusive, royalty-free, transferable, sublicensable, worldwide license to use, display, reproduce, adapt, modify (e.g., re-format), re-arrange, and distribute your User Content
      - source: terms
        quote: through any media now known or developed in the future
      - source: terms
        quote: This license will terminate at the time you remove your User Content from the Magnolia Rouge Services
      - source: terms
        quote: except as to any User Content that Magnolia Rouge has sublicensed prior to your removal of your User Content
      - source: terms
        quote: Magnolia Rouge does not claim any ownership rights
  credit_format:
    value: Attribution to the photographer or copyright holder; features carry the photographer as the byline, name the photographer and planner in the opening paragraph, and end with an Event Credits list of vendors by role.
    cite:
      - source: terms
        quote: Photographs used on the Magnolia Rouge Services on in any Magnolia Rouge publication will include attribution to the photographer and/or copyright holder.
      - source: feature_talloires
      - source: feature_tacoma
  couple_consent_required:
    value: unknown
    checked:
      - terms
      - questionnaire
    note: The terms bar user content showing a person posted without their consent; no submission page asks for the couple's consent.
  vendor_consent_required:
    value: true
    cite:
      - source: terms
        quote: without obtaining the prior written consent of the owner of such copyrighted material
    note: The copyright owner's written consent (usually the photographer's) when the submitter does not own the images; from the terms' copyright policy.

