id: pub-magnolia-rouge
name: Magnolia Rouge
url: https://magnoliarouge.com
kind: destination_international
tier: secondary
recheck_every_days: 90
taste_summary: Natural, organic and romantic real weddings and editorials from around the world, often in historic European venues or classic American settings, told as long narrative stories with full vendor credits.
notes: The submissions page (https://magnoliarouge.com/dashboard/submissions/, which /submissions/ redirects to) returned a Cloudflare bot challenge to a plain fetch on 2026-10-23 and was not read; package, fee and timing facts are unknown because that page did not load, not because the outlet has no rule. The Vendor Collective sign-up page and the media kit and pricing need an account and were not viewed. A 2014 Loverly interview with the founder was blocked by a bot challenge and is not used.

