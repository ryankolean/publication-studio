        quote: A Featured Wedding is a real wedding submission selected for publication on caratsandcake.com.
  elopement:
    value: true
    cite:
      - source: feature_cassandra_breno
    note: Inferred from a feature headlined as an elopement; no page lists elopements as a submission type.
  styled_shoot:
    value: true
    cite:
      - source: help_editorial
        quote: A styled shoot or creative concept created for inspiration rather than documenting a real wedding.
      - source: help_editorial
        quote: Editorials are published less often than real weddings, so selection is especially competitive
  style_tags:
    value: [ romantic, garden_botanical, multiple_looks, mediterranean_europe ]
