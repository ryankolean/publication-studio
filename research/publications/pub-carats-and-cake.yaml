insight:
  secret_sauce:
    - tip: Link the photographer's complete gallery with any passwords or download PINs; gallery problems are the top cause of review delays.
      cite:
        - source: help_submissions
          quote: Issues with the photo gallery are the number one reason your submission review will be delayed.
    - tip: Finish every vendor credit before submitting; incomplete submissions are the biggest cause of delays.
      cite:
        - source: help_submissions
          quote: Incomplete submissions are the single biggest cause of review delays — complete yours fully before you submit.
    - tip: Show what is new; the editors ask whether a wedding widens the locations, aesthetics, cultures, markets or budgets they cover.
      cite:
        - source: help_submissions
          quote: Does it expand the range of locations, aesthetics, cultures, markets, or budgets represented?
    - tip: Send a varied selection across the requested categories; the editors cut it down to the story themselves.
      cite:
        - source: help_submissions
          quote: Follow the requested categories and don't be afraid to provide variety. We will always edit the selection down to tell the most cohesive story.
    - tip: For styled shoots, keep the concept attainable and tied to real weddings; the editors flag concepts that feel unattainable or disconnected.
      cite:
        - source: help_editorial
          quote: Concepts that feel unattainable or disconnected from real weddings.
    - tip: Recent features went live four to six months after the wedding date.
      cite:
        - source: feature_meredith_cody
        - source: feature_laura_hunter
        - source: feature_emily_brennan
        - source: feature_cassandra_breno
  recent_features:
