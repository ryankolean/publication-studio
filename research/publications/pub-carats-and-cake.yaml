  gallery_hosts:
    value: [ direct_upload ]
    cite:
      - source: help_submissions
        quote: Upload your images.
    note: Images are uploaded into the form; a link to the photographer's complete gallery (with passwords or PINs) is also asked for, on any host.
  vendor_credits:
