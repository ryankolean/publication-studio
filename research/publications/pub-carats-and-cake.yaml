        quote: No. Carats + Cake does not sell editorial placement.
      - source: pricing
        quote: We don't make money on sponsorships, advertising, paid editorial, or promoted posts.
  priority_paid_tier:
    value:
      name: Pro Plus membership
      price:
        amount: 55
        currency: USD
        note: Per month, no annual contract.
      note: Expedited review only, typically within one week; no editorial advantage.
    cite:
      - source: pricing
        quote: Pro is $35 per month. Pro Plus is $55 per month.
      - source: help_submissions
        quote: Pro Plus Members get expedited review, meaning their submissions are reviewed first. There's no editorial advantage for Members — it's timing only.
      - source: how_it_works
        quote: with Pro Plus members receiving priority review, typically within one week.
