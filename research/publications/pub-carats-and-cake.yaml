routes:
  value:
    - platform: portal
      url: https://caratsandcake.com/submit-a-wedding
      account_required: true
      preferred: true
      steps:
        - Sign in to a free Carats + Cake account.
        - Select Submit a Wedding from the site header.
        - Choose Real Wedding, or Editorial Submission for a styled shoot.
        - Complete the submission details.
        - Upload the images.
        - Tag all known vendors.
        - Submit in a single session.
      note: The form itself is behind the login wall and was not viewed.
  cite:
    - source: submit_page
      quote: Login or create an account to submit a wedding and join the queue.
    - source: help_submissions
      quote: Sign in to your Account. Select Submit a Wedding from the site header or navigation.
    - source: help_editorial
      quote: select Editorial Submission instead of Real Wedding.

package:
  image_min:
    value: unknown
    checked: [ help_submissions, how_it_works ]
  image_max:
    value: unknown
    checked: [ help_submissions, how_it_works ]
