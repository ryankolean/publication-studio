        quote: you will be asked to enter them as a new vendor, which requires their Business Name and email address.
  story:
    value: unknown
    checked: [ help_submissions, how_it_works ]
    note: The listed submission information does not include a written story; the form itself was not viewed.
  video_accepted:
    value: true
    cite:
