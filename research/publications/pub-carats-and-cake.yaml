rights:
  image_usage:
    value: Perpetual, worldwide, non-exclusive, sublicensable royalty-free license to submitted images and details, including use in its AI search tools and to train its machine learning models; ownership stays with the submitter.
    cite:
      - source: terms
        quote: you expressly grant C&C a perpetual, worldwide, non-exclusive, fully sublicensable, royalty-free license to use, reproduce, display, modify, index, tag
      - source: terms
        quote: the right to use Your Content and associated metadata to develop, train, test, and improve the machine learning models
      - source: terms
        quote: submitting Your Content does not transfer ownership to C&C.
      - source: terms
        quote: the right to use such content within AI-powered or algorithmic tools that allow users to search and discover content
  credit_format:
    value: A Vendor Team list naming each tagged vendor's role and business name, linked to their Carats + Cake profile where one exists.
    cite:
      - source: help_featured
        quote: All tagged businesses are credited and the wedding becomes part of our editorial collection.
      - source: feature_meredith_cody
  couple_consent_required:
    value: unknown
    checked: [ help_submissions, terms ]
  vendor_consent_required:
