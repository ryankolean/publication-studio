routes:
  value:
    - platform: web_form
      url: https://overthemoon.com/pages/wedding-submissions
      account_required: false
      preferred: true
      steps:
        - Open the submissions page; the form loads on the page.
        - Choose who is submitting (photographer, couple or wedding planner).
        - Give the venue or location, wedding date and contact details.
        - Paste a non-expiring Dropbox-style link to up to 150 chronological, unwatermarked images of 1 to 3MB each.
        - Give both partners' names, professions and Instagram handles.
        - Answer whether an Over The Moon registry was made.
        - Write the wedding notes, accept the agreement and submit.
    - platform: web_form
      url: https://overthemoon.com/pages/directory-submissions
      account_required: true
      steps:
        - Enter the password Over The Moon gives Directory members.
        - Complete the Directory submission form for prioritized review.
      note: For paid Directory members only; the page is password-protected and the form was not viewed.
  cite:
    - source: submissions
      quote: Please fill out the form below and follow the guidelines in order to be considered for a feature on our site.
    - source: submissions
      quote: Are you a Directory member? If so, please submit your wedding HERE for prioritized review.
    - source: directory_submissions
      quote: Please enter the password provided by OTM to access this page

