insight:
  secret_sauce:
    - tip: Pitch couples with a visible story; recent features center a celebrity stylist, a bridal designer, a content creator and a planner, and the form asks for both partners' professions and Instagram handles.
      cite:
        - source: submissions
          quote: real weddings—the kind you frequently find yourself stalking on Instagram.
        - source: feature_danielle_brian
        - source: feature_ella_may_hughie
        - source: feature_claire_will
        - source: feature_paola_guillermo
    - tip: Name the fashion; recent features detail each designer look and outfit change across the weekend.
      cite:
        - source: feature_danielle_brian
        - source: feature_claire_will
        - source: feature_villa_cimbrone
    - tip: Fill the wedding notes with funny, unexpected or special moments, key guests and personalized details, and say if anything came from Over The Moon.
      cite:
        - source: form
          quote: Did anything funny, unexpected, or special happen? Were there key guests or personalized details? Was anything from the weekend from Over The Moon?
    - tip: Recent wedding dates range widely, from a September 2026 wedding published five days later to a May 2025 wedding published in September 2026.
      cite:
        - source: feature_claire_will
        - source: feature_villa_cimbrone
