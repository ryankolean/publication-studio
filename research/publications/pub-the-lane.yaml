id: pub-the-lane
name: The Lane
url: https://thelane.com
kind: destination_international
tier: primary
recheck_every_days: 90
taste_summary: Luxe, design-led European estate weddings told through a fashion and interiors lens, with sculptural florals, draped fabric, vintage silver and old stone.
notes: Raw HTML served to non-browser fetchers carries hidden casino spam links and keywords, and the site hosts spam posts under /blog-pages/ (seen on 2026-10-19 and again on 2026-10-23). Feature bodies are partly behind The Lane Premium paywall; only the public part was read. The agency's audience demographics and creative services pages are password-protected and were not read.

