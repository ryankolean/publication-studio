insight:
  secret_sauce:
    - tip: Match the house look. The Lane frames weddings through fashion, art, interiors and travel, and recent features are luxe European estates with sculptural florals, layered fabric and silver.
      cite:
        - source: about
          quote: reimagines weddings and events through the lens of fashion, art, interiors and travel
        - source: feature_borgo_stomennano
        - source: feature_barcelona
    - tip: Have the couple's "Our Story" answers ready; published features list names, location, wedding date, guest numbers and budget, then how they met and the engagement.
      cite:
        - source: feature_barcelona
    - tip: A decline is not final; the editors invite photographers to keep sending other weddings.
      cite:
        - source: guidelines
          quote: we encourage you to please keep in touch and send through any other submissions for consideration in future.
