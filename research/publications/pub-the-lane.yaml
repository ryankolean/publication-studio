routes:
  value:
    - platform: email
      account_required: false
      preferred: true
      steps:
        - Email the submissions inbox with "Real Wedding" and the couple's names in the subject line.
        - Include a Dropbox link to at least 30 images showing details from pre-reception, ceremony and reception.
        - For a lifestyle styled shoot, put "Styled Shoot Submission" and the concept name in the subject, and add a few sentences on the concept, inspiration and key vendors.
        - Expect a reply within 10 business days only if the submission is accepted.
      note: The inbox address is in the private contacts overlay.
  cite:
    - source: guidelines
      quote: with Real Wedding + Couple’s names in the subject line with Dropbox link to imagery.
    - source: guidelines
      quote: with ‘Styled Shoot Submission’ & your concept name in the subject line with Dropbox link to imagery.

