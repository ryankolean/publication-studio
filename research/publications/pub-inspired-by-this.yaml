routes:
  value:
    - platform: web_form
      url: https://www.inspiredbythis.com/submissions/
      account_required: false
      preferred: true
      steps:
        - Open the submission form on the submissions page.
        - Give your name, business name and email, and choose the type of submission.
        - Add the event date and location.
        - Say whether the event or gallery has been submitted or featured elsewhere, and where.
        - Paste a gallery link of up to 150 photos (no zip files) and a link to any social content.
        - List the vendors involved.
        - Describe the style, decor, inspiration and the story behind it.
        - Submit; a reply comes within about a week either way.
      note: Questions about a submission go to the submissions inbox, which is in the private contacts overlay.
  cite:
    - source: guidelines
      quote: If you have a chic event you want to share with us, submit it via the form below.
    - source: contact
      quote: If you are submitting your work to be featured on Inspired By This, please do so through our submissions page.
    - source: guidelines
      quote: Has this event/gallery been submitted or featured elsewhere? If yes, where?
    - source: guidelines
      quote: Gallery Link of up to 150 photos
    - source: guidelines
      quote: Link to any social content you’d like to share
    - source: guidelines
      quote: The vendors involved
    - source: guidelines
      quote: Tell us about this submission; the style, decor, inspiration and the story behind it!
    - source: guidelines
      quote: Have a question about your submission?

