insight:
  secret_sauce:
    - tip: Write the story up in detail and make the case for what is unique; the editors ask for it alongside big-picture images, details, decor highlights and product sources.
      cite:
        - source: guidelines
          quote: Big picture images, detailed shots, decor highlights, product sources, unique details, detailed story write-up that explains why your submission is unique!
    - tip: Send fresh work and be upfront about any earlier features; the site says it is about sharing new ideas.
      cite:
        - source: guidelines
          quote: we’re all about sharing new, inspiring ideas over here
        - source: guidelines
          quote: please let us know in advance if your submission has been featured elsewhere!
    - tip: Holiday and time-sensitive stories can skip the usual four-to-six-week wait.
      cite:
        - source: guidelines
          quote: Exceptions are made for time-sensitive & holiday content
    - tip: Show the bridal fashion story; three of the five newest features walk through several looks or outfit changes.
      cite:
        - source: feature_rhode_island
        - source: feature_palm_beach
        - source: feature_charleston
