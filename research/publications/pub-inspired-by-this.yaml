taste_summary: Polished, classic-leaning real weddings with garden settings, black-tie elegance and fashion-forward bridal looks, often with outfit changes; weddings sit beside home, family, travel and work content on a broad lifestyle site.
notes: A public web form with replies to every submission within about a week and publication about four to six weeks after acceptance. No advertise page or media kit is linked from the site, and no staff are named on its pages; features are bylined "IBT Girls".

