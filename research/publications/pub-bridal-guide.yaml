insight:
  secret_sauce:
    - tip: Put the creative team forward; the relaunched magazine sets out to celebrate the artists behind the weddings.
      cite:
        - source: kit
          quote: to pull back the curtain and celebrate the true artists creating some of the most
    - tip: Send a complete vendor list; every feature ends with one, including gown designers and planners.
      cite:
        - source: feature_chicago
          quote: "Vendors Photography: Cristina G Photo Planning: Events by Shaun Rajah"
        - source: feature_saint_tropez
    - tip: Destination weekends with cultural traditions and several outfits get long features; the Saint-Tropez story is marked as seen in the print magazine.
      cite:
        - source: feature_saint_tropez
          quote: As Seen in Bridal Guide
        - source: feature_hawaii
          quote: The celebrations opened with a Vietnamese tea ceremony
    - tip: Web-only features are short, a few paragraphs with a vendor list, so a strong edit of standout images matters more than a long story.
      cite:
        - source: feature_chicago
        - source: feature_raleigh
        - source: feature_connecticut
  recent_features:
    - source: feature_hawaii
      published: 2026-10-14
      location: US-HI
      content_type: real_wedding
      tags: [ hotel_resort, island_tropical, church_cathedral, culturally_rooted, fashion_forward_editorial, multiple_looks ]
