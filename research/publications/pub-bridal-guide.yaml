id: pub-bridal-guide
name: Bridal Guide
url: https://www.bridalguide.com
kind: national_magazine
tier: primary
recheck_every_days: 90
taste_summary: Relaunched in 2026 as a luxe print title celebrating the planners and designers behind the weddings; recent features range from short web posts on US hotel and waterfront weddings to long destination stories rich in cultural traditions and outfit changes.
notes: The only published route is an email address for wedding photos on the contact page; no submission guidelines were found, so package and rules facts are unknown. Two of the five recent features (Hawaii, Saint-Tropez) carry no published_time metadata; their dates are the og:updated_time values, which may be later than first publication. Reach figures come from the 2027 media kit PDF (created 2026-09-22) and the AAM publisher's statement linked from the advertise page.

