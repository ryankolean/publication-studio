insight:
  secret_sauce:
    - tip: Complete every field, writing "Do not know" or "N/A" rather than leaving gaps; a blank field takes the wedding out of print consideration.
      cite:
        - source: form
          quote: All fields must be filled in for consideration to print.
        - source: form
          quote: 'If you are the photographer and do not know the information, write: "Do not know".'
        - source: form
          quote: 'If you are the bride or groom and the field does not apply, write: "N/A".'
    - tip: Send print-resolution files; the editors check for 300 DPI at 8x10 inches.
      cite:
        - source: form
          quote: If your images are not high enough resolution (300DPI at 8x10” size) we will contact you to resolve.
    - tip: Cover the shot list with a variety of images, from the couple and wedding party to rings, flowers and table details.
      cite:
        - source: form
          quote: Try to submit a variety of photos and use this list as a loose guide
        - source: form
          quote: 1. bride(s) and/or groom(s) 2. wedding party 3. cake/dessert 4. dress/shoes 5. rings 6. reception 7. flowers 8. scene setter 9. table details
    - tip: Include the completed photo release with the form; it is a required upload.
      cite:
        - source: form
          quote: Completed Photo Release Form
  recent_features:
    - source: feature_jill_yaksh
      published: 2026-09-09
