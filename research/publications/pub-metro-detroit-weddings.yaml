id: pub-metro-detroit-weddings
name: Metro Detroit Weddings
url: https://www.detroitwed.com
kind: regional_magazine
tier: secondary
recheck_every_days: 90
taste_summary: Hour Media's twice-yearly print bridal magazine for metro Detroit; its Real Weddings album entries are short listings (both partners' hometowns, wedding date, venue and a full vendor list), from Orthodox church weddings to historic estates and downtown lofts.
notes: The Wedding Album form is the print route; album entries are reposted online, tagged with their print issue. The Third-Party Photo Release Agreement PDF the form requires (https://www.detroitwed.com/wp-content/uploads/sites/41/2024/06/MDW-Third-Party-Photo-Release-Agreement-7-25-21.pdf) returned 403 to plain fetches and was not read. The current media kit sits behind a lead form that was not submitted; the 2018/2019 media kit linked from the contact page was not read. The site also has engagement and marriage announcement forms, which are notices, not features.

