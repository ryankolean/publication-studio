routes:
  value:
    - platform: web_form
      url: https://www.detroitwed.com/wedding-album-submission-form/
      account_required: false
      preferred: true
      steps:
        - Download the photo release form from the submission page, complete it and upload it as a PDF.
        - Give the submitter's name, email and phone.
        - Give both partners' names and hometowns, the wedding date, a partner's phone and email, and the ceremony and reception venues with addresses.
        - Fill in every vendor field, including the photographer's and planner's emails; a photographer who lacks a detail writes "Do not know", a couple writes "N/A" where a field does not apply.
        - Add at least 10 to 15 high-resolution photos, by upload or a sharing link, following the shot list.
        - Complete the CAPTCHA and submit.
      note: Every field is required for print consideration; the editorial team chooses the weddings.
  cite:
    - source: form
      quote: All fields must be filled in for consideration to print.
    - source: form
      quote: Completed Photo Release Form * Download the form here
    - source: form
      quote: A submission does not guarantee your photos will be published. Weddings will be chosen by the editorial team.
    - source: form
      quote: "Form and photos submitted by: Name * First Last Email * Phone *"
    - source: form
      quote: CAPTCHA

package:
  image_min:
    value: 10
    cite:
      - source: form
        quote: Along with the form, please submit at least 10-15 photos per wedding that you wish to see featured.
    note: The form asks for "at least 10-15"; 10 is the lower bound.
  image_max:
    value: unknown
    checked: [ form ]
  resolution:
    value:
      max_file_mb: 256
      note: Images under 300 DPI at 8x10 inches are followed up by the editors.
    cite:
      - source: form
        quote: "Accepted file types: jpg, gif, png, pdf, Max. file size: 256 MB."
      - source: form
        quote: If your images are not high enough resolution (300DPI at 8x10” size) we will contact you to resolve.
    note: 300 DPI at 8x10 inches works out to 2400 by 3000 pixels. The 256 MB cap is the upload field's limit.
  size:
    value: print
    cite:
      - source: form
        quote: In addition to having images published with the printed magazine
      - source: form
        quote: If your images are not high enough resolution (300DPI at 8x10” size) we will contact you to resolve.
