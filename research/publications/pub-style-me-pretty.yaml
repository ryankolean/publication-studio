routes:
  value:
    - platform: portal
      url: https://www.stylemepretty.com/submissions
      account_required: true
      preferred: true
      steps:
        - Create a Style Me Pretty account and sign in.
        - Open the Submissions Dashboard.
        - Put the city and state in the submission title.
        - Upload the images, and any video.
        - Write the description, answering as many of the writing prompts as possible.
        - List every vendor, with website links and social handles.
        - Submit.
      note: The dashboard is behind the login and was not viewed. The cinematographer guidance mentions attaching images to an email, but no page gives an address for submissions; the contact page lists only a help inbox for submission questions.
  cite:
    - source: contact
      quote: After you have created an account and are ready to submit, head over here
    - source: guidelines
      quote: Go to Submissions Dashboard
    - source: guidelines
      quote: It gives you a space for your images, a place to upload videos, an area for a description and a vendor credit spot.
    - source: faq
      quote: Please do your best to properly respond to as many of the writing prompts provided in the submission as you can

package:
  image_min:
    value: 80
    cite:
      - source: guidelines
        quote: 80-150 images that you feel best highlight the wedding.
    note: The 2021 tips article says 80-120 is ideal.
  image_max:
    value: 150
    cite:
      - source: guidelines
        quote: 80-150 images that you feel best highlight the wedding.
    note: The 2021 tips article says 80-120 is ideal.
  resolution:
    value:
      min_width_px: 900
      max_file_mb: 5
    cite:
      - source: guidelines
        quote: We need individual images at least 900 pixels wide and no more than 5MB each, to accommodate our blog width.
  size:
    value: unknown
    checked: [ guidelines, faq ]
    note: Only pixel and file-size limits are given (at least 900 px wide, at most 5MB); no page says web or print size.
  orientation_mix:
    value: Mostly vertical, with about 10% horizontal.
    cite:
      - source: guidelines
        quote: Vertical imagery is best, with about 10% horizontal.
      - source: faq
        quote: the majority of your gallery should be vertical imagery, with about 10% horizontal!
  watermarks_allowed:
    value: unknown
    checked: [ guidelines, faq ]
  gallery_hosts:
    value: [ direct_upload ]
    cite:
      - source: guidelines
        quote: It gives you a space for your images, a place to upload videos, an area for a description and a vendor credit spot.
      - source: faq
        quote: Upload a full gallery of images
  vendor_credits:
    value:
      required: true
      fields: [ business_name, website ]
      note: A photography credit is mandatory, and a credit left out cannot be added later. Social handles are asked for everyone involved, including dress and fashion designers.
    cite:
      - source: guidelines
        quote: Please list ALL applicable vendors. We must have a photography credit to consider a wedding for publication.
      - source: guidelines
        quote: If a vendor is not credited up front, we will be unable to go back and add the credit.
      - source: guidelines
        quote: The more urls we can get, the better.
      - source: guidelines
        quote: Social Handles for Everyone Involved
  story:
    value:
      required: true
      questionnaire: true
      note: Ideally written by the couple; words from the planner, designer or photographer also work. The form provides writing prompts.
    cite:
      - source: faq
        quote: a detailed description of the day (see tip #3), and a full list of vendor credits
      - source: faq
        quote: Ideally, we like to have the write-up come from the couple, but that's not an absolute
      - source: faq
        quote: Please do your best to properly respond to as many of the writing prompts provided in the submission as you can
  video_accepted:
    value: true
    cite:
      - source: faq
        quote: Please be sure that your video is in either Youtube or Vimeo format and the sharing settings are set public.
      - source: guidelines
        quote: We like videos that are under 3 minutes, ideally in the 2 minute time frame.
  other_requirements:
    value:
      - The city and state in the submission title.
      - The submitter's company name and name, the date and location of the event, and the couple's names.
      - Mostly color images, with only a small select group in black and white.
      - Flat lays in the gallery.
      - Video as a public YouTube or Vimeo link, ideally about two minutes and under three.
      - From cinematographers, a 15-second clip for social media is welcome.
    cite:
      - source: guidelines
        quote: Include a city + state in the title of your submission.
      - source: guidelines
        quote: Your Company Name / Your Name / Date and Location of the Event / Couple's names
      - source: guidelines
        quote: We love color photos as they look best on our blog.
      - source: guidelines
        quote: feel free to include a very select group of black and white imagery as well.
      - source: faq
        quote: It’s super easy to forget about flat lays - but they provide the perfect amount of breathing room in every gallery
      - source: faq
        quote: Please be sure that your video is in either Youtube or Vimeo format and the sharing settings are set public.
      - source: guidelines
        quote: It would be AWESOME (I repeat AWESOME) if we also had a 15 second video to push around social.

