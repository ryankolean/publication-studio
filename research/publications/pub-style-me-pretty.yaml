id: pub-style-me-pretty
name: Style Me Pretty
url: https://www.stylemepretty.com
kind: blog
tier: dream
recheck_every_days: 90
taste_summary: Pretty, fresh, clean and classic with a twist; airy, film-like editorial images with details styled against clean backdrops. Recent features lean classic coastal and garden weddings in blue and white.
notes: The Submissions Dashboard sits behind an account login and was not viewed; package facts come from the public submissions page and the 2021 tips article linked from it as Frequently Asked Submission Questions. The Little Black Book page was read in a browser. The 2015 "SMP Submission Advice with Abby Larson" post holds only an embedded interview video from The Photo Report and is not used.

