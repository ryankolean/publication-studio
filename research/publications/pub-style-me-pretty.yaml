insight:
  secret_sauce:
    - tip: Fill in every part of the submission tool (images, video, description, vendor credits); ready-to-go submissions move fast, while ones that need chasing wait.
      cite:
        - source: guidelines
          quote: The longer it takes us to chase down information, the more likely we are to put it on the back burner
        - source: guidelines
          quote: And those that are ready to go, will have an enormously fast turn around time!
    - tip: Match the house look; the editors favor airy, film-like, magazine-style images with details styled against clean, simple backdrops.
      cite:
        - source: faq
          quote: We love those gorgeous, film-focused, airy, editorial-driven photographs.
        - source: guidelines
          quote: Where the details are set against a simple, clean backdrop and have been thoughtfully styled.
    - tip: Cover the bride, fashion, wedding party, groom, flowers, decor, favors and invitations, and keep dancing shots few.
      cite:
        - source: guidelines
          quote: We need images that show the bride, her fashions, the maids, the groom, the flowers, centerpieces, decor elements, favors, invitations, etc.
        - source: guidelines
          quote: WE DO NOT WANT too many images of the guests dancing or smoking cigars
    - tip: Lead with what is new; the editors ask for fresh takes on old styles, indoor weddings and weddings that reflect their city.
      cite:
        - source: guidelines
          quote: new approaches to old styles (i.e. show us an awesome new way to approach a barn wedding), indoor affairs
        - source: guidelines
          quote: If there is a unique angle, it will definitely catch our attention.
    - tip: Representation counts; SMP asks for BIPOC and same-sex weddings, and diversity or a touching story can carry a wedding that is weaker elsewhere.
      cite:
        - source: faq
          quote: we are always looking for same sex weddings to publish as well.
        - source: faq
          quote: it has an element of diversity or a very touching story - then we will absolutely do our very best to make it work!
    - tip: Ask for the needs list; some regions are under-covered.
      cite:
        - source: guidelines
          quote: We are often lacking content from certain areas and if you reach out, we’ll be happy to share our needs list.
    - tip: Odds are long; 400 to 600 weddings arrive each week and about 2-3% reach the front page.
      cite:
        - source: guidelines
          quote: SMP receives between 400-600 weddings each week.
        - source: faq
          quote: our editorial team carefully selects a mere 2-3% for publication on the Front Page.
    - tip: Give the permalink of your own blog post so the feature can link it on the same day.
      cite:
        - source: guidelines
          quote: provide the permalink to which it will go live on the same day that we are publishing it.
    - tip: Stay gracious after a decline; the editors remember who was kind and who was not.
      cite:
        - source: guidelines
          quote: we remember those that are gracious, kind and fun to work with
    - tip: Recent features are built from the form's writing prompts (Design / Vibe / Vision, Proposal Story, the fashion, food, florals, cake and special details), so full answers become the article.
      cite:
        - source: feature_oahu
        - source: feature_rehoboth
