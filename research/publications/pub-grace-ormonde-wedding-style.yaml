id: pub-grace-ormonde-wedding-style
name: Grace Ormonde Wedding Style
url: https://www.weddingstylemagazine.com
kind: national_magazine
tier: secondary
recheck_every_days: 90
taste_summary: Luxury, fashion-led weddings with couture gowns, grand florals and five-star or historic venues; most recent features are destination weddings at European castles and villas or US resort hotels.
notes: The submission form is a Typeform drawn by script. Its welcome screen was confirmed in a headless browser render; the questions, the thank-you screen and the field notes were read from the form definition embedded in the Typeform page, so plain fetches show none of that text. Feature pages show the wedding date but not the publication date; the recent_features dates come from each page's article:published_time metadata. The Digital Issues page (https://www.weddingstylemagazine.com/digital-magazine-issues/) listed no issues without a browser render, so print frequency was not read.

