routes:
  value:
    - platform: web_form
      url: https://form.typeform.com/to/hORCu88h
      account_required: false
      preferred: true
      steps:
        - Open the Photographer Submissions form.
        - Give the contact name and the company or agency name, and say whether you are a member (Platinum Member, Grace Ormonde Contributor or Photographer Ambassador) or not yet a member.
        - Give an email address for the photography release, a phone number and, optionally, a website.
        - Choose the submission type (Proposals, Engagement Photo Shoot, Real Weddings, Fashion Photo Shoot or Wedding Decor).
        - Paste a Dropbox link.
        - Sign the photography release form that arrives by email.
        - Expect an acceptance email within 72 hours only if accepted.
      note: The form is a public Typeform with no sign-in, embedded on the site's Photographer Submissions page. Non-members can submit.
  cite:
    - source: submit_page
      quote: Photographer Submissions
    - source: form
      quote: "Are you a member?"
    - source: form
      quote: No, I am not a member yet
    - source: form
      quote: "Please share your Dropbox link here:"
    - source: form
      quote: We will sent you the photography release to this email.
    - source: form
      quote: You will receive an email to sign the release form.
    - source: form
      quote: If your submission is accepted, look for our accept email in 72 hours.

