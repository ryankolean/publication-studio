  other_requirements:
    value:
      - The email subject line starts with the word "Submission".
      - The first email gives the wedding date and the location or venue.
      - A generous mix of fashion and decor details and emotive moments of connection, joy and celebration.
      - Tell the editors whether the wedding has appeared or is being arranged elsewhere, and what has been shared on social media and where.
      - No AI-generated imagery; ordinary post-production is fine.
      - No photography workshop images.
    cite:
