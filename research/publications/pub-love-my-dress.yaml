rules:
  exclusivity:
    value:
      policy: exclusive_required
      after_publication_days: 180
    cite:
      - source: guidelines
        quote: We ask that Love My Dress is the first wedding publication to feature your wedding.
      - source: guidelines
        quote: After your feature is published, please wait six months before submitting the wedding to any other publication.
    note: Six months stored as 180 days. Once accepted, no further carousels, reels or galleries may be shared until the feature is live.
  prior_exposure:
    publications:
      value: unknown
      checked:
        - guidelines
      note: Love My Dress asks to be the first publication and to be told of any earlier feature; it does not say one disqualifies.
    blogs:
      value: allowed
      cite:
        - source: guidelines
          quote: You, the couple and the wider team are welcome to share individual images on your own websites and social channels at any time.
      note: Own websites only; a feature on another blog counts as a prior publication.
    social:
      value: allowed
      cite:
        - source: guidelines
          quote: If a carousel, reel or full gallery has already been shared, please don’t let that put you off submitting
        - source: guidelines
          quote: Once a submission is accepted, we ask that no further carousels, reels or galleries are shared until the feature is live
      note: Individual images may be shared at any time; after acceptance, hold back further carousels, reels and galleries until the feature is live.
  freshness_window_months:
    value: 12
    cite:
      - source: guidelines
        quote: Ideally, weddings that have happened within the past 12 months, though we’re always flexible.
    note: A preference, not a cutoff; the Paris feature ran about 15 months after its July 2025 wedding.
  photographer_frequency:
    value: unknown
    checked: [ guidelines ]
  submitter_roles:
    value: [ photographer, planner, vendor ]
    cite:
      - source: guidelines
        quote: We genuinely love to hear from all suppliers, vendors and venues
      - source: guidelines
        quote: whether photographer, planner, stylist, venue or designer
    note: The roles are named for editorials and shoots; real weddings are open to any supplier, vendor or venue. The couple receives the questionnaire through the submitter; no page says couples may submit.

