insight:
  secret_sauce:
    - tip: Shoot and select mostly portrait images, about 80/20 portrait to landscape, because most readers view the site on mobile.
      cite:
        - source: guidelines
          quote: We share more portrait images than landscape and recommend an 80/20 portrait to landscape mix.
        - source: guidelines
          quote: Most of our readers view Love My Dress on mobile and hand-held devices
    - tip: Show how the couple brought their personalities into the day through fashion, decor and readings, alongside plenty of emotive moments of connection and joy.
      cite:
        - source: guidelines
          quote: We love seeing how a couple brought their personalities into the day through fashion, decor, readings and the decisions they made while planning.
        - source: guidelines
          quote: It’s the emotive moments of connection, joy, celebration and love that bring a feature to life
    - tip: Name the dress designer in the first email; it is the one supplier the guidelines single out.
      cite:
        - source: guidelines
          quote: key suppliers, particularly the dress
    - tip: Weddings from communities underrepresented in wedding media, and mature couples, are especially welcome.
      cite:
        - source: guidelines
          quote: we’re especially keen to feature weddings from communities that are underrepresented in wedding media
        - source: guidelines
          quote: We also love to share the stories of mature couples
    - tip: Keep sharing to individual images once accepted; a wedding already widely shared reaches fewer new people when the outlet posts it.
      cite:
        - source: guidelines
          quote: a wedding that’s already been widely shared reaches far fewer new people when we post it.
    - tip: The editor values the couple's story as much as the images, and favours honest weddings that reflect the couple.
      cite:
        - source: vuelio_interview
          quote: it’s our consistent approach to the story and not just the images.
        - source: vuelio_interview
          quote: My favourite weddings, however, are always the most honest ones
  recent_features:
    - source: feature_magic_show
      published: 2026-10-18
      location: GB
      content_type: real_wedding
      tags: [ bold_color_maximalist, whimsical, playful_party, alternative_nontraditional ]
