routes:
  value:
    - platform: email
      account_required: false
      preferred: true
      steps:
        - Email the submissions inbox with a subject line that starts with the word "Submission".
        - Attach 25 to 30 low-res images, at least 1000 pixels wide, directly to the email; no Zip files, WeTransfer, Dropbox or third-party gallery links at this stage.
        - Include the date, the location or venue, the key suppliers (particularly the dress) and a little about the day; a short paragraph is fine.
        - Love My Dress asks to be the first publication to feature the wedding; earlier social posts do not rule it out.
        - Expect to hear back within 5 working days; if accepted, send the full wedding and pass the questionnaire to the couple.
      note: Real weddings are open to everyone, with Directory members prioritised. Editorials and styled shoots go by the same route but only when the lead creative is a Directory member. The inbox address is in the private contacts overlay.
  cite:
    - source: guidelines
      quote: Please submit 25-30 low-res images (at least 1000 pixels wide) via straight-forward email attachment to
    - source: guidelines
      quote: Please try to ensure your email subject line starts with the word ‘Submission’.
    - source: guidelines
      quote: If accepted, you will receive further instructions and a questionnaire to pass on to the bride/couple.
    - source: guidelines
      quote: Please do not send Zip files, Wetransfer, Dropbox or link to a third party website (ie, Pictime) at this stage.
    - source: guidelines
      quote: including the date, location or venue and key suppliers, particularly the dress, along with a little about the day itself.
    - source: guidelines
      quote: A short paragraph is absolutely great, but share as much as you like.
    - source: guidelines
      quote: We ask that Love My Dress is the first wedding publication to feature your wedding.
    - source: guidelines
      quote: If a carousel, reel or full gallery has already been shared, please don’t let that put you off submitting
    - source: guidelines
      quote: you can expect to hear back from us within 5 working days.
    - source: guidelines
      quote: Once we have received the full wedding and completed questionnaire

