id: pub-love-my-dress
name: Love My Dress
url: https://www.lovemydress.net
kind: destination_international
tier: primary
recheck_every_days: 90
taste_summary: Story-led, human real weddings with a strong fashion and personality focus; recent features mix colourful, vintage-inspired London weddings with US and Paris celebrations, and the editor is keen on couples underrepresented in wedding media.
notes: UK blog (North Yorkshire). US weddings are published (the five newest real weddings include Vermont and New York's Hudson Valley, and the site files weddings under a "USA" location). No page states a geographic limit or says anything about weddings abroad; the newest features include a London couple's Paris celebration filed under "Destination". Directory prices, the media pack and audience figures are shown only after a business registration is approved and were not viewed. The submissions inbox address is in the private contacts overlay.

