insight:
  secret_sauce:
    - tip: Get the whole vendor team to link to the feature and show the As Featured On badge; features perform better when everyone takes part.
      cite:
        - source: guidelines
          quote: Features perform significantly better when the entire vendor team participates.
        - source: guidelines
          quote: Display our "As Featured On" badge on your website
    - tip: Tell the day as a visual story of details, atmosphere, portraits and setting, with authentic beauty, elevated design and heartfelt storytelling.
      cite:
        - source: guidelines
          quote: "A strong visual narrative: details, atmosphere, portraits, and setting"
        - source: guidelines
          quote: Images reflect authentic beauty, elevated design, and heartfelt storytelling
    - tip: Send 60 to 80 images at 3000px or more, with vertical frames for the hero and feature images.
      cite:
        - source: guidelines
          quote: Minimum 50 images, ideally 60–80
        - source: guidelines
          quote: Minimum 2000px on longest side (3000px+ preferred)
        - source: guidelines
          quote: Vertical (portrait) preferred for hero and feature images
    - tip: Submit within a year of the wedding, ideally before it appears anywhere else.
      cite:
        - source: guidelines
          quote: We accept submissions up to 12 months after the wedding date.
        - source: guidelines
          quote: First-time publication preferred
    - tip: Include the film if there is one; the editors would love to add the video.
      cite:
        - source: guidelines
          quote: If the wedding was filmed, we would love to include the video
  recent_features:
    - source: feature_vaugency
      published: 2026-10-22
      location: FR
