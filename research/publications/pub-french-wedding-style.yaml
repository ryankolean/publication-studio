routes:
  value:
    - platform: web_form
      url: https://www.frenchweddingstyle.com/submit-wedding/screening/
      account_required: false
      preferred: true
      steps:
        - Open the sneak peek form.
        - Fill in your details and say whether the wedding has been published or sent to another website, and where.
        - Paste the gallery link, with access details if the gallery is gated.
        - Describe the wedding in at least 50 characters and submit.
        - If approved, French Wedding Style sends the link to the full submission form.
      note: The free route for everyone who is not a Premium member, including members whose plan does not include Real Wedding features.
    - platform: web_form
      url: https://www.frenchweddingstyle.com/submit-wedding/member/
      account_required: unknown
      steps:
        - Enter your full name and business name at the member door.
        - Continue straight to the full submission form, with no sneak peek.
      note: Premium members only (a paid membership, see priority_paid_tier). The door asks only for a name and business name; it was not continued.
  cite:
    - source: guidelines
      quote: Submit a sneak peek For everyone else, including members whose plan does not include Real Wedding features.
    - source: screening
      quote: Found the full form first? Share your gallery link below and we'll send you the link to complete your submission once approved.
    - source: screening
      quote: Has this wedding been published or sent to another website? If yes, please tell us where.
    - source: screening
      quote: Access details (optional) Only needed if the gallery is gated.
    - source: screening
      quote: 0/50 characters (min)
    - source: member_door
      quote: For Premium members. Add your name and business name, and we will take you straight to the full submission form, with no sneak peek needed.

package:
  image_min:
    value: 50
    cite:
      - source: guidelines
        quote: Minimum 50 images, ideally 60–80
  image_max:
    value: unknown
    checked: [ guidelines, screening ]
    note: The page asks for 50 to 80 images, ideally 60 to 80, but does not call 80 a limit.
  resolution:
    value:
      min_long_edge_px: 2000
      note: 3000px or more preferred; JPEG or TIFF in sRGB.
    cite:
      - source: guidelines
        quote: Minimum 2000px on longest side (3000px+ preferred)
      - source: guidelines
        quote: JPEG or TIFF, high-resolution, sRGB colour space
  size:
    value: unknown
    checked: [ guidelines ]
    note: The page asks for high-resolution files with a pixel minimum (in resolution) but does not say web or print.
  orientation_mix:
    value: Vertical (portrait) images preferred for the hero and feature images.
    cite:
      - source: guidelines
        quote: Vertical (portrait) preferred for hero and feature images
  watermarks_allowed:
    value: false
    cite:
      - source: guidelines
        quote: No watermarks, we credit with a full link in every feature
  gallery_hosts:
    value: any
    cite:
      - source: screening
        quote: Pic-Time, Pixieset, Cloudspot, ShootProof, Google Drive, Dropbox, WeTransfer, or any other hosted gallery works.
  vendor_credits:
    value:
      required: true
      fields: [ website, instagram ]
      note: A videographer credit with Instagram handle is required when there is video; the bride's dress designer or boutique is asked for too.
    cite:
      - source: guidelines
        quote: Full vendor credit list with website URLs and Instagram handles
      - source: guidelines
        quote: Videographer credit and Instagram handle required
  story:
    value:
      required: true
      questionnaire: true
      note: Ten guided prompts, each at least 20 words, on the full form; the sneak peek needs only a description of at least 50 characters.
    cite:
      - source: guidelines
        quote: Written story, 10 guided prompts, each at least 20 words
  video_accepted:
    value: true
    cite:
      - source: guidelines
        quote: If the wedding was filmed, we would love to include the video
  other_requirements:
    value:
      - Wedding date and couple names.
      - Venue name and region in France.
      - Guest count.
      - The photographer's permission to publish.
      - The bride's dress designer or boutique name.
      - Images covering getting ready, ceremony, couple portraits, reception details and tablescapes, speeches and first dance, venue grounds, fashion details and florals.
      - Clean editing with no heavy filters or over-processing.
      - Video as a 2 to 5 minute highlights film by download link, native .mp4 preferred, with reels as separate links.
    cite:
