id: pub-french-wedding-style
name: French Wedding Style
url: https://www.frenchweddingstyle.com
kind: destination_international
tier: secondary
recheck_every_days: 90
taste_summary: Weddings in France only, mostly château and estate weekends in Provence and the Riviera for international couples, with colourful florals, long dinner tables and full vendor teams.
notes: Two routes. Anyone can send a free sneak peek and gets the full-form link only if the wedding is a fit; paid Premium members go straight to the full form. The full form was not viewed, because it opens only after approval or through the member door. The terms of use say some editorial content is written with AI assistance and reviewed by the editors.

