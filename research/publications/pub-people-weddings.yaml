insight:
  secret_sauce:
    - tip: >-
        Wedding exclusives center on public figures and run within days of the wedding, built on quotes the couple gives PEOPLE directly; a pitch needs a newsworthy couple ready to talk and a fast turnaround.
      cite:
        - source: feature_nashville
          quote: the couple exclusively tells PEOPLE
