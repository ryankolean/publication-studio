id: pub-people-weddings
name: People (Weddings)
url: https://people.com/weddings
kind: national_magazine
tier: dream
recheck_every_days: 90
taste_summary: Celebrity and public-figure weddings, mostly as exclusives with the couple's own quotes, published within days of the event.
notes: >-
  No public route for submitting a wedding was found on the weddings section or the about page. The about page lists a general tips inbox for ideas and leads, which does not mention weddings, so it is not treated as a submissions inbox and no contacts overlay was written. The masthead lists a Weddings and Parents team. Sister brand Brides runs the People Inc. real-wedding submission form. Every wedding feature read was labeled Exclusive and centered on a public figure; they ran 2 to 7 days after the wedding.

