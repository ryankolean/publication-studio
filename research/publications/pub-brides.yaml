routes:
  value:
    - platform: web_form
      url: https://airtable.com/appMIIbAShOWgZURB/shrK7JfoOhigyH6u0
      account_required: false
      preferred: true
      steps:
        - Open the form linked from the Real Wedding Submission Guidelines page.
        - Give the submitter name and email, the couple's full names, the venue and location with a venue link, and the wedding date or dates.
        - Give the photographer's full name and list the important vendors.
        - Answer whether social video from a content creator or other vendor exists.
        - Paste a Dropbox folder link holding 100 to 200 professionally shot images, then submit.
      note: The shared form opened without signing in. Pre- and post-wedding events can go in with the wedding or on their own.
  cite:
    - source: guidelines
      quote: To submit a wedding for consideration, please fill out and submit the form here.
    - source: form
      quote: We accept submissions on a rolling basis.

