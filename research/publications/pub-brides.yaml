id: pub-brides
name: Brides
url: https://www.brides.com
kind: national_magazine
tier: primary
recheck_every_days: 90
taste_summary: Wedding weekends told event by event, with strong decor, fashion for every look and a personal story; recent features lean romantic and garden-led, often destination.
notes: >-
  Submissions go through a free Airtable form linked from the guidelines page; the form's text was read from the public form definition the page loads. Only Dropbox galleries are reviewed. No submissions inbox is published; the about page lists general, press, writer and sales addresses only. Real-wedding output on the site looks slow in 2026: the Real Weddings index showed four new features dated 2026-03-30 to 2026-07-29, and the one before them ran 2025-10-09. Weddings in the features read ran 11 to 15 months after the wedding date. The earlier pass noted a videographer-name field; the form read today has no such field, only an optional social-video question.

