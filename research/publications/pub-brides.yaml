insight:
  secret_sauce:
    - tip: Lead with decor, a distinctive story and standout fashion; the guidelines name all three as what the editors want.
      cite:
        - source: guidelines
          quote: We love to feature weddings with stunning décor, unique stories, and show-stopping fashion
    - tip: Send the whole weekend. Welcome parties, rehearsal dinners and other events are taken alone or with the wedding, and every recent feature read walks through several events.
      cite:
        - source: guidelines
          quote: These Real Wedding Events can be submitted along with a wedding or on their own for consideration.
        - source: feature_hudson_valley
        - source: feature_utah
        - source: feature_san_miguel
    - tip: Say so if a content creator or another vendor shot social video; the form asks.
      cite:
        - source: form
          quote: Is there social video available from the wedding, via a content creator or other vendor?
    - tip: Credit every outfit. Recent features list attire and accessories for each event in the vendor credits, alongside the usual vendors.
      cite:
        - source: feature_hudson_valley
  recent_features:
    - source: feature_hudson_valley
