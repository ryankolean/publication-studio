insight:
  secret_sauce:
    - tip: Details and decor carry a submission; make about 60% of the gallery detail and decor shots.
      cite:
        - source: guidelines
          quote: Our main focus is the details and decor, so include LOTS of those shots!
        - source: guidelines
          quote: Your submission gallery should include 60% detail/decor photos, including wide shots of the ceremony and reception
    - tip: Choose a couple who will happily be interviewed.
      cite:
        - source: guidelines
          quote: We do interview the couple, so they must be open to speaking with us.
    - tip: Say so on the form if a preferred vendor or an editor asked for the submission.
      cite:
        - source: form
          quote: Did a Marry Me Tampa Bay preferred vendor or someone from our editorial team ask you to submit this wedding?
    - tip: Fresh weddings are preferred, ideally within six to nine months.
      cite:
        - source: guidelines
          quote: Our preference is to feature weddings that have taken place within the last six to nine months.
