coverage:
  regions:
    value: [ US-FL:tampa-bay, US-FL:sarasota ]
    cite:
      - source: guidelines
        quote: The wedding must have taken place in the Tampa Bay, Central Florida, or Sarasota areas.
      - source: guidelines
        quote: We are currently not accepting submissions of weddings held in Orlando.
    note: Central Florida outside Orlando is also accepted; geo.yaml has no code for it.
  basis:
    value: wedding_location
    cite:
      - source: guidelines
        quote: The wedding must have taken place in the Tampa Bay, Central Florida, or Sarasota areas.
  destination_accepted:
    value: unknown
    checked: [ guidelines ]
    note: Coverage turns on where the wedding took place; whether the couple traveled is not discussed.

content:
  real_wedding:
    value: true
    cite:
      - source: guidelines
        quote: To submit a wedding to Marry Me Tampa Bay, please make sure it has the following criteria
  elopement:
    value: unknown
    checked: [ guidelines, form ]
  styled_shoot:
    value: true
    cite:
      - source: guidelines
        quote: We do accept a limited number styled shoots, but do not accept engagement photos.
    note: A limited number.
  style_tags:
    value: [ romantic, vintage_heritage, hotel_resort, beach_coastal, playful_party, bold_color_maximalist ]
