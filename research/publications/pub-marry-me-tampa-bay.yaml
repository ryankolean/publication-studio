        quote: All vendor credits are listed at the bottom of the feature.
      - source: terms
        quote: Vendor credits will be linked to past features on Marry Me Tampa Bay or to “member” profile pages.
      - source: terms
        quote: We do not link to external vendor websites.
      - source: terms
        quote: We do not accept watermarked photos or “caption” a photo with photographer credit.
  couple_consent_required:
    value: true
    cite:
      - source: guidelines
        quote: Before you submit, please double-check with the couple that they want their wedding shared (not all couples do).
  vendor_consent_required:
    value: unknown
    checked: [ form ]
    note: The form asks whether the photographer knows of the submission; permission is not asked for.

