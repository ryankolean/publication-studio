id: pub-marry-me-tampa-bay
name: Marry Me Tampa Bay
url: https://marrymetampabay.com
kind: regional_magazine
tier: secondary
recheck_every_days: 90
taste_summary: Detail- and decor-led weddings in Tampa Bay, Clearwater, St. Pete and Sarasota, from candlelit romance to colorful retro.
notes: marrymetampabay.com answers plain fetches with a bot challenge; every page below was read in a browser on 2026-10-23. Feature dates come from the site's own public posts listing.

