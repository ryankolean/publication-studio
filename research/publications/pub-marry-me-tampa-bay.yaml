rules:
  exclusivity:
    value:
      policy: exclusive_required
      after_publication_days: 60
    cite:
      - source: guidelines
        quote: Marry Me Tampa Bay requires exclusivity for featured weddings and styled shoots.
      - source: guidelines
        quote: cannot be submitted to or featured by another media outlet for a period of 60 days after it goes live on Marry Me Tampa Bay.
    note: Afterwards the feature may run elsewhere if Marry Me Tampa Bay is credited as the original publisher. Exclusivity during review is not stated.
  prior_exposure:
    publications:
      value: disqualifies
      cite:
        - source: guidelines
          quote: We do accept weddings that have been previously featured on national publications
        - source: guidelines
          quote: Submissions must not have been previously published in any Florida-based wedding publication, magazine, or blog
      note: Any Florida-based publication, magazine or blog disqualifies; national features are accepted.
    blogs:
      value: unknown
      checked: [ guidelines ]
      note: Florida-based wedding blogs disqualify; a vendor's own blog is not addressed.
    social:
      value: unknown
      checked: [ guidelines ]
      note: A Florida-based publication's social media counts as prior publication; posts by the couple or vendors are not addressed.
  freshness_window_months:
    value: 9
    cite:
      - source: guidelines
        quote: Our preference is to feature weddings that have taken place within the last six to nine months.
    note: A stated preference, not a hard limit.
  photographer_frequency:
    value: unknown
    checked: [ guidelines ]
  submitter_roles:
    value: [ photographer, planner, vendor ]
    cite:
      - source: guidelines
        quote: please go contact your wedding photographer or planner; we do not accept submissions from the couple.
      - source: form
        quote: Business Name
    note: Wedding businesses only; never the couple.

