      - source: feature_innisbrook
      - source: feature_nova_535
      - source: feature_sandpearl
    note: From the features' headlines and venues (neon disco, candlelit romance, Bridgerton-inspired resort, vintage romance, coastal beach resort).
  seasonality:
    value: unknown
    checked: [ guidelines ]

routes:
  value:
    - platform: web_form
      url: https://marrymetampabay.com/contact-us/submission/
      account_required: false
      preferred: true
      steps:
        - Check with the couple that they want the wedding shared and are open to an interview.
        - Open the submission form on the submit page; do not email the submission.
        - Give your business name and the couple's contact details for text follow-up.
        - Link the photographer's gallery with any passwords or download pins; Dropbox and Google Drive are refused.
        - Add the vendor list, list any other outlets the wedding was sent to or ran in, accept the terms and the exclusivity policy, and submit.
  cite:
    - source: guidelines
      quote: Do NOT email your submission.
    - source: guidelines
      quote: Before you submit, please double-check with the couple that they want their wedding shared (not all couples do).
    - source: form
      quote: Please include the photographer's gallery and any passwords/download pins.
    - source: form
      quote: We do NOT accept galleries via Dropbox, Google Drive, or other third-party sites.
    - source: form
      quote: What other publications have you submitted this wedding or what other publications have accepted or published this feature?
    - source: form
      quote: I have read and agree to the exclusivity policy as outlined above
    - source: form
      quote: Business Name
    - source: form
      quote: We will not call them, only text to follow up for their quotes

