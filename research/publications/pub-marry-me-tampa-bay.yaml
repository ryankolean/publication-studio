  other_requirements:
    value:
      - About 60% of the gallery is detail and decor, including wide shots of the ceremony and reception.
      - Photos covering the various phases of the wedding day.
      - No individual portraits of the wedding party and no guests dancing.
      - The couple's phone number, for text follow-up on their interview quotes.
    cite:
      - source: guidelines
        quote: Your submission gallery should include 60% detail/decor photos, including wide shots of the ceremony and reception
      - source: guidelines
        quote: These photos should cover various phases of the wedding day, such as
      - source: guidelines
        quote: Do NOT include individual portraits of the wedding party (though we do want group photos) or guests dancing at the reception.
      - source: form
